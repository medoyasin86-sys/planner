<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #f9f9fb;
      font-family: "Cairo", sans-serif;
    }

    /* الشريط الرئيسي */
    .header-bar {
      width: 1200px;
      padding: 8px;
      background: #ffffff;
      border: 1px solid #e6e6e6;
      border-radius: 10px;
      display: flex;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      box-sizing: border-box;
    }

    /* العناصر */
    .item {
      padding: 6px 10px;
      background: #f3f3f8;
      border-radius: 6px;
      text-align: center;
      white-space: nowrap;
    }

    /* ألوان بسيطة */
    .a { background: #f7ecff; } /* الطابور */
    .b { background: #e8f4ff; } /* حصص */
    .c { background: #fff8d8; } /* فسحة */

  </style>
</head>

<body>

  <div class="header-bar">

    <div class="item a">الطابور<br>7:30–7:40</div>

    <div class="item b">1<br>7:40–8:15</div>
    <div class="item b">2<br>8:15–8:50</div>
    <div class="item b">3<br>8:50–9:25</div>
    <div class="item b">4<br>9:25–10:00</div>

    <div class="item c">فسحة<br>10:00–10:10</div>

    <div class="item b">5<br>10:10–10:45</div>
    <div class="item b">6<br>10:45–11:20</div>
    <div class="item b">7<br>11:20–11:55</div>
    <div class="item b">8<br>11:55–12:30</div>

  </div>

</body>
</html>
