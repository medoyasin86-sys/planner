<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تكبير الصور للطباعة - My Family's Mihrab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .control-group { display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: bold; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .btn { background: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #2980b9; }
        #previewContainer { margin-top: 20px; text-align: center; display: none; }
        #previewImage { max-width: 100%; border-radius: 8px; border: 2px dashed #3498db; }
        .status { margin-top: 10px; font-size: 14px; color: #e67e22; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>أداة تكبير وتجزئة الصور للطباعة</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>اختر الصورة:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="control-group">
            <label>اتجاه الطباعة:</label>
            <select id="orientation">
                <option value="p">عمودي (Portrait)</option>
                <option value="l">أفقي (Landscape)</option>
            </select>
        </div>
        <div class="control-group">
            <label>عدد الصفحات عرضاً:</label>
            <input type="number" id="cols" value="2" min="1">
        </div>
        <div class="control-group">
            <label>عدد الصفحات طولاً:</label>
            <input type="number" id="rows" value="2" min="1">
        </div>
    </div>

    <div id="previewContainer">
        <p>معاينة الصورة المرفوعة:</p>
        <img id="previewImage" src="" alt="Preview">
    </div>

    <button class="btn" onclick="generatePDF()">توليد ملف PDF عالي الجودة</button>
    <div id="status" class="status"></div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    document.getElementById('imageInput').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = document.getElementById('previewImage');
            img.src = event.target.result;
            document.getElementById('previewContainer').style.display = 'block';
        }
        reader.readAsDataURL(e.target.files[0]);
    };

    async function generatePDF() {
        const imageInput = document.getElementById('imageInput');
        if (!imageInput.files[0]) {
            alert('يرجى اختيار صورة أولاً');
            return;
        }

        const status = document.getElementById('status');
        status.innerText = "جاري معالجة الصورة وتقسيمها...";

        const orientation = document.getElementById('orientation').value;
        const cols = parseInt(document.getElementById('cols').value);
        const rows = parseInt(document.getElementById('rows').value);
        
        const img = new Image();
        img.src = document.getElementById('previewImage').src;

        img.onload = function() {
            const pdf = new jsPDF({
                orientation: orientation,
                unit: 'mm',
                format: 'a4'
            });

            const pw = pdf.internal.pageSize.getWidth();
            const ph = pdf.internal.pageSize.getHeight();
            
            // مساحة التراكب (10 ملم)
            const overlap = 10; 

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (r > 0 || c > 0) pdf.addPage();

                    // حساب الجزء المقطوع من الصورة الأصلية
                    const sWidth = img.width / cols;
                    const sHeight = img.height / rows;
                    const sx = c * sWidth;
                    const sy = r * sHeight;

                    // رسم الجزء المخصص في الصفحة
                    pdf.addImage(img, 'JPEG', 0, 0, pw, ph, null, 'SLOW', 0, {
                        sourceX: sx,
                        sourceY: sy,
                        sourceWidth: sWidth,
                        sourceHeight: sHeight
                    });

                    // إضافة مساحة التراكب (Overlap)
                    pdf.setFillColor(200, 200, 200); // لون رصاصي
                    pdf.rect(pw - overlap, 0, overlap, ph, 'F'); 
                    pdf.rect(0, ph - overlap, pw, overlap, 'F');

                    // كتابة Paste Here
                    pdf.setTextColor(255, 255, 255);
                    pdf.setFontSize(10);
                    pdf.text("Paste Here", pw - (overlap/2), ph/2, { angle: 90, align: 'center' });
                    pdf.text("Paste Here", pw/2, ph - (overlap/2), { align: 'center' });

                    // إضافة خطوط القص (أحمر متقطع)
                    pdf.setDrawColor(255, 0, 0);
                    pdf.setLineDashPattern([2, 2], 0);
                    pdf.line(pw - overlap, 0, pw - overlap, ph);
                    pdf.line(0, ph - overlap, pw, ph - overlap);

                    // إضافة الترقيم
                    pdf.setTextColor(0, 0, 0);
                    pdf.setFontSize(12);
                    pdf.text(`صفحة: ${r + 1}-${c + 1} | My Family's Mihrab`, 10, 10);
                }
            }

            pdf.save("Poster_Large_Print.pdf");
            status.innerText = "تم تحميل الملف بنجاح!";
        };
    }
</script>

</body>
</html>
