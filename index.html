<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>متابع العبادات الملكي</title>
<style>
body { background-color: #f0f0f0; padding: 20px; font-family: sans-serif; }
.container { max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 30px; }
.card { background: #fffdf5; border: 2px solid #9d7d32; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.friday { border: 2px solid #1b5e20; background-color: #fafffa; }
.header { display: flex; justify-content: space-between; border-bottom: 2px double #9d7d32; margin-bottom: 15px; padding-bottom: 10px; }
.title { font-size: 22px; color: #735b22; font-weight: bold; }
.friday .title { color: #1b5e20; }
.day-input { width: 180px; border-bottom: 1px dashed #999; }
.grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 20px; }
h3 { font-size: 15px; color: #9d7d32; border-right: 4px solid #9d7d32; padding-right: 8px; margin-top: 5px; }
.friday h3 { color: #1b5e20; border-right-color: #1b5e20; }
.item { display: flex; align-items: center; font-size: 13px; margin-bottom: 8px; color: #333; }
.chks { margin-right: auto; display: flex; gap: 5px; font-size: 11px; color: #666; }
input { width: 16px; height: 16px; cursor: pointer; }
.sig { text-align: left; margin-top: 15px; font-size: 18px; font-style: italic; color: #9d7d32; border-top: 1px solid #eee; padding-top: 10px; }
.purple { color: #8e44ad; font-weight: bold; }
.green { color: #1b5e20; font-weight: bold; }
</style>
</head>
<body>

<div class="container">

</div>
</body>
</html>
