<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تكبير الصور - مقاس A4 احترافي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --danger: #e74c3c; --gray: #bdc3c7; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .main-container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin: auto; }
        .header { border-bottom: 2px solid #eee; margin-bottom: 25px; padding-bottom: 10px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; text-align: right; gap: 5px; }
        label { font-weight: bold; font-size: 13px; color: var(--primary); }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn-action { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { background: #34495e; transform: translateY(-2px); }
        .legend { margin-top: 20px; display: flex; justify-content: center; gap: 20px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .color-box { width: 15px; height: 15px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h2>أداة طباعة البوسترات العملاقة (A4)</h2>
        <p>تحديد دقيق لمناطق القص والتراكب بمقاس 1.5 سم</p>
    </div>

    <div class="grid-inputs">
        <div class="input-group">
            <label>1. ارفع الصورة:</label>
            <input type="file" id="imgUpload" accept="image/*">
        </div>
        <div class="input-group">
            <label>2. عرض البوستر (سم):</label>
            <input type="number" id="wCm" value="100">
        </div>
        <div class="input-group">
            <label>3. ارتفاع البوستر (سم):</label>
            <input type="number" id="hCm" value="100">
        </div>
        <div class="input-group">
            <label>4. وضعية الورقة:</label>
            <select id="orient">
                <option value="p">عمودي (Portrait)</option>
                <option value="l">أفقي (Landscape)</option>
            </select>
        </div>
    </div>

    <button class="btn-action" onclick="generateHighQualityPDF()">توليد ملف PDF للطباعة</button>

    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background: #bdc3c7;"></div> منطقة التراكب (لاصق)</div>
        <div class="legend-item"><div class="color-box" style="border: 1px dashed red;"></div> خط القص الأحمر</div>
    </div>
    
    <div id="status" style="margin-top: 20px; color: #7f8c8d;"></div>
</div>

<script>
    async function generateHighQualityPDF() {
        const { jsPDF } = window.jspdf;
        const input = document.getElementById('imgUpload');
        const targetW = parseFloat(document.getElementById('wCm').value) * 10;
        const targetH = parseFloat(document.getElementById('hCm').value) * 10;
        const orient = document.getElementById('orient').value;
        const status = document.getElementById('status');

        if (!input.files[0]) { alert("يرجى اختيار صورة"); return; }

        status.innerText = "جاري معالجة الأوراق... يرجى الانتظار";

        const img = new Image();
        img.src = URL.createObjectURL(input.files[0]);

        img.onload = function() {
            const pdf = new jsPDF({ orientation: orient, unit: 'mm', format: 'a4' });
            const pW = pdf.internal.pageSize.getWidth();
            const pH = pdf.internal.pageSize.getHeight();
            const overlap = 15; // 1.5 سم

            const effW = pW - overlap;
            const effH = pH - overlap;

            const cols = Math.ceil(targetW / effW);
            const rows = Math.ceil(targetH / effH);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (r > 0 || c > 0) pdf.addPage();

                    // رسم الجزء المخصص من الصورة
                    const xOffset = -c * effW;
                    const yOffset = -r * effH;
                    pdf.addImage(img, 'JPEG', xOffset, yOffset, targetW, targetH, undefined, 'SLOW');

                    // --- رسم منطقة التراكب (رصاصي) ---
                    pdf.setFillColor(189, 195, 199); // لون رصاصي واضح
                    
                    // تراكب الجهة اليمنى (إذا كان هناك عمود تالٍ)
                    if (c < cols - 1) {
                        pdf.rect(pW - overlap, 0, overlap, pH, 'F');
                        pdf.setTextColor(255, 255, 255);
                        pdf.setFontSize(8);
                        pdf.text("PASTE HERE", pW - (overlap/2), pH/2, { angle: 90, align: 'center' });
                    }

                    // تراكب الجهة السفلية (إذا كان هناك صف تالٍ)
                    if (r < rows - 1) {
                        pdf.rect(0, pH - overlap, pW, overlap, 'F');
                        pdf.setTextColor(255, 255, 255);
                        pdf.text("PASTE HERE", pW/2, pH - (overlap/2), { align: 'center' });
                    }

                    // --- رسم خطوط القص (أحمر متقطع) ---
                    pdf.setDrawColor(231, 76, 60); // أحمر
                    pdf.setLineDashPattern([2, 2], 0);
                    pdf.setLineWidth(0.5);

                    // خط قص عمودي
                    if (c < cols - 1) pdf.line(pW - overlap, 0, pW - overlap, pH);
                    // خط قص أفقي
                    if (r < rows - 1) pdf.line(0, pH - overlap, pW, pH - overlap);

                    // --- الترقيم والمعلومات ---
                    pdf.setLineDashPattern([], 0);
                    pdf.setTextColor(44, 62, 80);
                    pdf.setFontSize(10);
                    pdf.text(`الورقة: ${r * cols + c + 1} | الموقع: صف ${r+1}-عمود ${c+1}`, 5, 10);
                }
            }

            pdf.save(`Poster_A4_${targetW/10}x${targetH/10}cm.pdf`);
            status.innerText = "تم إنشاء الملف بنجاح!";
        };
    }
</script>

</body>
</html>
