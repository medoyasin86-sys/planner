<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --card: 56px;
  --gap: 6px;

  --ruby: #8b002b;
  --ruby-ink: #ffffff;

  --cream: #faeedb;
  --cream-ink: #8b002b;

  --border: #d8c8be;
}

body{
  margin:0;
  padding:20px;
  background:#f7f3f1;
  font-family:"Cairo","Noto Kufi Arabic",sans-serif;
}

.wrap{
  background:#ffffff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  width:fit-content;
  margin:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(10, var(--card));
  grid-template-rows:repeat(3, var(--card));
  gap:var(--gap);
}

.card{
  width:var(--card);
  height:var(--card);
  border-radius:8px;
  display:flex;
  justify-content:center;
  align-items:center;
  box-sizing:border-box;
  border:1px solid #60001f;
  overflow:visible;
}

/* بطاقات الحصص */
.card.mark{
  background:var(--ruby);
  color:var(--ruby-ink);
}

/* البطاقات المصمتة (بدل ط/ف) */
.card.empty{
  background:var(--ruby);
  border-color:#60001f;
}

/* بطاقة من/إلى */
.card.time{
  background:var(--cream);
  border:1px solid #e0d3c6;
  color:var(--cream-ink);
}

/* اتجاه رأسي كامل */
.v{
  writing-mode:vertical-rl;
  text-orientation:upright;
  font-weight:900;
  line-height:1;
}

/* رقم الحصة */
.num{
  font-size:20px;
  font-weight:900;
}

/* الوقت */
.time-text{
  font-size:13px;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="grid">

    <!-- الصف 1 (حصص/ياقوتي) -->
    <div class="card empty"></div>
    <div class="card mark"><div class="v num">1</div></div>
    <div class="card mark"><div class="v num">2</div></div>
    <div class="card mark"><div class="v num">3</div></div>
    <div class="card mark"><div class="v num">4</div></div>
    <div class="card empty"></div>
    <div class="card mark"><div class="v num">5</div></div>
    <div class="card mark"><div class="v num">6</div></div>
    <div class="card mark"><div class="v num">7</div></div>
    <div class="card mark"><div class="v num">8</div></div>

    <!-- الصف 2 (من) -->
    <div class="card time"><div class="v time-text">7:30</div></div>
    <div class="card time"><div class="v time-text">7:40</div></div>
    <div class="card time"><div class="v time-text">8:15</div></div>
    <div class="card time"><div class="v time-text">8:50</div></div>
    <div class="card time"><div class="v time-text">9:25</div></div>
    <div class="card time"><div class="v time-text">10:00</div></div>
    <div class="card time"><div class="v time-text">10:10</div></div>
    <div class="card time"><div class="v time-text">10:45</div></div>
    <div class="card time"><div class="v time-text">11:20</div></div>
    <div class="card time"><div class="v time-text">11:55</div></div>

    <!-- الصف 3 (إلى) -->
    <div class="card time"><div class="v time-text">7:40</div></div>
    <div class="card time"><div class="v time-text">8:15</div></div>
    <div class="card time"><div class="v time-text">8:50</div></div>
    <div class="card time"><div class="v time-text">9:25</div></div>
    <div class="card time"><div class="v time-text">10:00</div></div>
    <div class="card time"><div class="v time-text">10:10</div></div>
    <div class="card time"><div class="v time-text">10:45</div></div>
    <div class="card time"><div class="v time-text">11:20</div></div>
    <div class="card time"><div class="v time-text">11:55</div></div>
    <div class="card time"><div class="v time-text">12:30</div></div>

  </div>
</div>

</body>
</html>
