<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #faf8f5;
      font-family: "Cairo", sans-serif;
    }

    /* الشريط الرئيسي */
    .header-bar {
      width: 1200px;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #e8e0d8;
      border-radius: 8px;
      display: flex;
      gap: 6px;
      box-sizing: border-box;
    }

    /* البطاقات */
    .item {
      width: 60px;               /* تضييق العرض */
      height: 60px;              /* لجعلها مربّعة */
      background: #f2e7d8;
      border-radius: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 800;          /* Bold قوي وواضح */
      font-size: 16px;           /* تكبير الخط */
      line-height: 1.1;
      color: #5a000f;
    }

    /* ألوان Ruby */
    .ruby {
      background: #b30035;
      color: #ffffff;
    }

    /* وقت أصغر قليلاً */
    .time {
      font-size: 10px;
      margin-top: 2px;
      opacity: 0.9;
      font-weight: 600;
    }

  </style>
</head>

<body>

  <div class="header-bar">

    <div class="item ruby">
      ط
      <div class="time">7:30–7:40</div>
    </div>

    <div class="item">1<div class="time">7:40–8:15</div></div>
    <div class="item">2<div class="time">8:15–8:50</div></div>
    <div class="item">3<div class="time">8:50–9:25</div></div>
    <div class="item">4<div class="time">9:25–10:00</div></div>

    <div class="item ruby">
      ف
      <div class="time">10:00–10:10</div>
    </div>

    <div class="item">5<div class="time">10:10–10:45</div></div>
    <div class="item">6<div class="time">10:45–11:20</div></div>
    <div class="item">7<div class="time">11:20–11:55</div></div>
    <div class="item">8<div class="time">11:55–12:30</div></div>

  </div>

</body>
</html>
