<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة التكبير الدقيقة - My Family's Mihrab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #c0392b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin: auto; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; background: #ecf0f1; padding: 20px; border-radius: 10px; }
        .input-group { display: flex; flex-direction: column; text-align: right; gap: 5px; }
        label { font-weight: bold; font-size: 13px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-download { background: #27ae60; }
        .btn-print { background: #2980b9; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* منطقة المعاينة */
        .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .preview-card { border: 1px solid #ddd; border-radius: 10px; padding: 15px; background: #fff; text-align: center; }
        
        /* ضبط المعاينة الأصلية لتطابق التقسيم */
        .image-wrapper { 
            position: relative; 
            display: inline-block; 
            margin: auto;
            border: 2px solid var(--primary);
            line-height: 0;
        }
        #original-img { max-width: 100%; height: auto; }
        .grid-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            display: grid; 
            pointer-events: none; 
        }
        .grid-cell { 
            border: 1px solid rgba(255, 255, 0, 0.6); 
            display: flex; align-items: center; justify-content: center; 
            color: yellow; font-weight: bold; font-size: 14px;
            text-shadow: 1px 1px 3px #000;
        }

        #pages-preview { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .page-box { border: 1px solid #333; background: #eee; position: relative; font-size: 10px; }
        .overlap-gray { position: absolute; background: rgba(150, 150, 150, 0.6); }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">أداة تكبير الصور مع المطابقة الذكية للشبكة</h2>
    
    <div class="controls">
        <div class="input-group">
            <label>1. اختر الصورة:</label>
            <input type="file" id="fileInput" accept="image/*" onchange="initApp()">
        </div>
        <div class="input-group">
            <label>2. العرض المطلوب (سم):</label>
            <input type="number" id="wCm" value="80" oninput="updateAll()">
        </div>
        <div class="input-group">
            <label>3. الارتفاع المطلوب (سم):</label>
            <input type="number" id="hCm" value="100" oninput="updateAll()">
        </div>
        <div class="input-group">
            <label>4. اتجاه A4:</label>
            <select id="orient" onchange="updateAll()">
                <option value="p">عمودي (Portrait)</option>
                <option value="l">أفقي (Landscape)</option>
            </select>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-download" onclick="generate(false)">تحميل PDF</button>
        <button class="btn btn-print" onclick="generate(true)">طباعة فورية</button>
    </div>

    <div class="preview-grid">
        <div class="preview-card">
            <h4>خريطة الترقيم الأصلية (دليلك للتجميع)</h4>
            <div id="wrapper" class="image-wrapper">
                <img id="original-img" src="">
                <div id="grid-layer" class="grid-overlay"></div>
            </div>
        </div>

        <div class="preview-card">
            <h4>شكل الأوراق المطبوعة (A4)</h4>
            <div id="pages-preview"></div>
        </div>
    </div>
</div>

<script>
    const overlap = 15; // 1.5 سم

    function initApp() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('original-img');
            img.src = e.target.result;
            img.onload = updateAll;
        };
        reader.readAsDataURL(file);
    }

    function updateAll() {
        const img = document.getElementById('original-img');
        if (!img.src) return;

        const orient = document.getElementById('orient').value;
        const targetW = parseFloat(document.getElementById('wCm').value) * 10;
        const targetH = parseFloat(document.getElementById('hCm').value) * 10;
        
        const pW = orient === 'p' ? 210 : 297;
        const pH = orient === 'p' ? 297 : 210;
        const effW = pW - overlap;
        const effH = pH - overlap;

        const cols = Math.ceil(targetW / effW);
        const rows = Math.ceil(targetH / effH);

        // ضبط الشبكة لتطابق الصورة تماماً
        const layer = document.getElementById('grid-layer');
        layer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        layer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        layer.innerHTML = '';

        for (let i = 1; i <= (rows * cols); i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.innerText = i;
            layer.appendChild(cell);
        }

        // معاينة الأوراق
        const pagesPreview = document.getElementById('pages-preview');
        pagesPreview.innerHTML = '';
        const scale = 0.25;
        for (let r = 0; r < rows; r++) {
            const row = document.createElement('div');
            row.style.display = 'flex'; row.style.gap = '5px'; row.style.marginBottom = '5px';
            for (let c = 0; c < cols; c++) {
                const p = document.createElement('div');
                p.className = 'page-box';
                p.style.width = pW * scale + 'px'; p.style.height = pH * scale + 'px';
                p.innerHTML = `<br>${r * cols + c + 1}`;
                
                if (c < cols - 1) { // تراكب يمين
                    const v = document.createElement('div');
                    v.className = 'overlap-gray';
                    v.style.right = '0'; v.style.top = '0'; v.style.width = overlap * scale + 'px'; v.style.height = '100%';
                    p.appendChild(v);
                }
                if (r < rows - 1) { // تراكب أسفل
                    const h = document.createElement('div');
                    h.className = 'overlap-gray';
                    h.style.bottom = '0'; h.style.left = '0'; h.style.width = '100%'; h.style.height = overlap * scale + 'px';
                    p.appendChild(h);
                }
                row.appendChild(p);
            }
            pagesPreview.appendChild(row);
        }
    }

    async function generate(isPrint) {
        const { jsPDF } = window.jspdf;
        const img = document.getElementById('original-img');
        if (!img.src) return;

        const targetW = parseFloat(document.getElementById('wCm').value) * 10;
        const targetH = parseFloat(document.getElementById('hCm').value) * 10;
        const orient = document.getElementById('orient').value;

        const pdf = new jsPDF({ orientation: orient, unit: 'mm', format: 'a4' });
        const pW = pdf.internal.pageSize.getWidth();
        const pH = pdf.internal.pageSize.getHeight();
        const effW = pW - overlap;
        const effH = pH - overlap;

        const cols = Math.ceil(targetW / effW);
        const rows = Math.ceil(targetH / effH);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (r > 0 || c > 0) pdf.addPage();
                
                // رسم الصورة بالمقاس المستهدف مع الإزاحة
                pdf.addImage(img, 'JPEG', -c * effW, -r * effH, targetW, targetH, undefined, 'SLOW');

                // التراكب والقص
                pdf.setFillColor(200, 200, 200);
                if (c < cols - 1) {
                    pdf.rect(pW - overlap, 0, overlap, pH, 'F');
                    pdf.setTextColor(255, 255, 255); pdf.setFontSize(8);
                    pdf.text("PASTE HERE", pW - (overlap/2), pH/2, { angle: 90, align: 'center' });
                }
                if (r < rows - 1) {
                    pdf.rect(0, pH - overlap, pW, overlap, 'F');
                    pdf.setTextColor(255, 255, 255); pdf.setFontSize(8);
                    pdf.text("PASTE HERE", pW/2, pH - (overlap/2), { align: 'center' });
                }

                pdf.setDrawColor(255, 0, 0); pdf.setLineDashPattern([2, 2], 0);
                if (c < cols - 1) pdf.line(pW - overlap, 0, pW - overlap, pH);
                if (r < rows - 1) pdf.line(0, pH - overlap, pW, pH - overlap);

                pdf.setLineDashPattern([], 0); pdf.setTextColor(0, 0, 0); pdf.setFontSize(10);
                pdf.text(`رقم الورقة: ${r * cols + c + 1}`, 5, 10);
            }
        }

        if (isPrint) { pdf.autoPrint(); window.open(pdf.output('bloburl'), '_blank'); }
        else { pdf.save(`Poster_${targetW/10}x${targetH/10}cm.pdf`); }
    }
</script>

</body>
</html>
