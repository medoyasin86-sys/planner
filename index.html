<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة يوم المعلم العماني 2026 - مدرسة المشاش</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            font-family: 'Amiri', serif;
            color: #d4af37;
        }

        .card-container {
            position: relative;
            width: 90%;
            max-width: 600px;
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            overflow: hidden;
            border: 5px solid #d4af37;
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png'); /* نمط زخرفي خفيف */
        }

        .card-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid #d4af37;
            margin: 10px;
            pointer-events: none;
        }

        .header-title {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 2.5em;
            color: #bc1823; /* الأحمر العماني */
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .school-name {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .illustration {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            background: #f9f9f9;
            border-radius: 50%;
            border: 3px double #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
        }

        .message {
            font-size: 1.3em;
            line-height: 1.8;
            color: #444;
            margin: 20px 0;
            padding: 0 20px;
        }

        .gold-divider {
            height: 2px;
            width: 80%;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 20px auto;
        }

        .footer-year {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.8em;
            color: #bc1823;
            margin-top: 15px;
        }

        .btn-print {
            margin-top: 25px;
            padding: 10px 30px;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Amiri', serif;
            font-size: 1.1em;
            transition: 0.3s;
        }

        .btn-print:hover {
            background-color: #bc1823;
            transform: scale(1.05);
        }

        /* زينة الزوايا */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 4px solid #d4af37;
        }
        .top-right { top: 0; right: 0; border-bottom: none; border-left: none; }
        .bottom-left { bottom: 0; left: 0; border-top: none; border-right: none; }

    </style>
</head>
<body>

    <div class="card-container">
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>

        <div class="header-title">يوم المعلم العماني</div>
        <div class="school-name">مدرسة المشاش للتعليم الأساسي</div>
        
        <div class="gold-divider"></div>

        <div class="illustration">🎓</div>

        <div class="message">
            إلى بناة العقول وصنّاع الأجيال في صرح <strong>مدرسة المشاش</strong>، <br>
            نهنئكم بعطائكم المتجدد الذي يضيء دروب عمان بالفكر والمعرفة. <br>
            كل عام وأنتم نبراس للحق ورمز للفخر.
        </div>

        <div class="gold-divider"></div>

        <div class="footer-year">٢٠٢٦ م</div>
        
        <button class="btn-print" onclick="window.print()">حفظ كصورة / طباعة</button>
    </div>

</body>
</html>
