<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تهنئة يوم المعلّم العُماني ٢٠٢٦</title>

<!-- خطوط عربية فاخرة -->
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    padding:0;
    background:#f2f2f2;
    font-family:'Cairo', sans-serif;
  }

  .card{
    width:1080px;
    height:1350px;
    margin:auto;
    background:#b80000;
    position:relative;
    overflow:hidden;
    color:#fff;
    box-shadow:0 30px 60px rgba(0,0,0,.3);
  }

  /* زخارف إسلامية */
  .pattern{
    position:absolute;
    inset:0;
    background-image:url('https://i.imgur.com/iwZ1G4J.png');
    background-size:cover;
    opacity:.08;
  }

  /* زخرفة ذهبية عليا */
  .gold-top{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:220px;
    background:linear-gradient(180deg, rgba(212,175,55,.9), rgba(212,175,55,.0));
    clip-path:polygon(0 0, 100% 0, 100% 65%, 0 45%);
    opacity:0.25;
  }

  /* العنوان */
  .title{
    position:absolute;
    top:90px;
    right:70px;
    font-family:'Aref Ruqaa', serif;
    font-size:90px;
    line-height:1.1;
    color:#ffffff;
    text-shadow:0 4px 12px rgba(0,0,0,.3);
  }

  .subtitle{
    position:absolute;
    top:300px;
    right:70px;
    font-size:40px;
    font-weight:700;
    color:#ffe6e6;
  }

  /* صورة رمزية للمعلم العماني (بدون نقد أو ملاحظات على الوجوه) */
  .teacher-illustration{
    position:absolute;
    bottom:0;
    left:0;
    width:580px;
    height:auto;
  }

  /* مربع أبيض سفلي */
  .footer-box{
    position:absolute;
    bottom:0;
    width:100%;
    height:320px;
    background:#ffffff;
    border-top-left-radius:40px;
    border-top-right-radius:40px;
    box-shadow:0 -10px 25px rgba(0,0,0,.2);
    padding-top:40px;
    text-align:center;
    color:#333;
  }

  .footer-title{
    font-size:48px;
    font-weight:900;
    color:#b80000;
    margin-bottom:20px;
  }

  .footer-msg{
    font-size:32px;
    font-weight:600;
    line-height:1.7;
    margin-bottom:30px;
    color:#222;
  }

  .school{
    font-size:36px;
    font-weight:900;
    color:#b80000;
  }

  /* QR اختياري */
  .qr{
    position:absolute;
    bottom:30px;
    right:40px;
    width:180px;
  }

</style>
</head>

<body>

<div class="card">

  <div class="pattern"></div>
  <div class="gold-top"></div>

  <div class="title">
    يوم المعلّم<br>
    العُماني ٢٠٢٦
  </div>

  <div class="subtitle">
    شكراً لصنّاع العِلْم وبُنَاة الأجيال
  </div>

  <!-- ضع صورة رسومية لرمز المعلم هنا -->
  <img src="https://i.imgur.com/5XJrUvE.png" class="teacher-illustration">

  <!-- القسم الأبيض -->
  <div class="footer-box">

    <div class="footer-title">
      تهنئة خاصة بمناسبة يوم المعلّم العُماني
    </div>

    <div class="footer-msg">
      بكل فخر واعتزاز تتقدّم<br>
      <strong>مدرسة المشاش للتعليم الأساسي</strong><br>
      بأطيب التهاني لجميع المعلّمين والمعلّمات في يومهم.
    </div>

    <div class="school">
      مدرسة المشاش للتعليم الأساسي
    </div>

    <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://example.com">
  </div>

</div>

</body>
</html>
