<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #faf8f5; /* بيج ناعم للخلفية */
      font-family: "Cairo", sans-serif;
    }

    /* الشريط الرئيسي */
    .header-bar {
      width: 1200px;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #e8e0d8; /* بيج فاتح جدًا */
      border-radius: 8px;
      display: flex;
      gap: 4px;
      font-size: 13px;
      font-weight: 700; /* Bold للأرقام */
      box-sizing: border-box;
    }

    /* العناصر */
    .item {
      padding: 4px 10px;
      border-radius: 4px;
      text-align: center;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* ألوان Ruby + Beige */
    .ruby { background: #b30035; color: #ffffff; } /* أحمر ياقوتي */
    .beige { background: #f2e7d8; color: #5a000f; } /* بيج محايد */
    
  </style>
</head>

<body>

  <div class="header-bar">

    <div class="item ruby">ط<br>7:30–7:40</div>

    <div class="item beige">1<br>7:40–8:15</div>
    <div class="item beige">2<br>8:15–8:50</div>
    <div class="item beige">3<br>8:50–9:25</div>
    <div class="item beige">4<br>9:25–10:00</div>

    <div class="item ruby">ف<br>10:00–10:10</div>

    <div class="item beige">5<br>10:10–10:45</div>
    <div class="item beige">6<br>10:45–11:20</div>
    <div class="item beige">7<br>11:20–11:55</div>
    <div class="item beige">8<br>11:55–12:30</div>

  </div>

</body>
</html>
