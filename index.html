<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة يوم المعلم العماني 2026 - مدرسة المشاش</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --oman-red: #d21034;
            --oman-green: #00843d;
            --oman-gold: #c9a050;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Amiri', serif;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
            border: 10px solid var(--white);
            text-align: center;
        }

        /* الإطار الزخرفي العماني */
        .card-border {
            border: 2px solid var(--oman-gold);
            margin: 10px;
            padding: 40px 20px;
            border-radius: 15px;
            position: relative;
        }

        /* شعار تخيلي أو رمز الخنجر/العلم */
        .top-pattern {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background-color: var(--oman-red);
            mask: url('https://cdn-icons-png.flaticon.com/512/323/323344.png') no-repeat center;
            -webkit-mask: url('https://cdn-icons-png.flaticon.com/512/323/323344.png') no-repeat center;
            mask-size: contain;
        }

        h1 {
            font-family: 'Reem Kufi', sans-serif;
            color: var(--oman-red);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--oman-green);
            font-size: 1.4rem;
            margin-bottom: 25px;
        }

        .content {
            line-height: 1.8;
            color: #333;
            font-size: 1.2rem;
        }

        .school-name {
            font-weight: bold;
            color: var(--oman-red);
            display: block;
            margin-top: 15px;
            font-size: 1.4rem;
        }

        .footer-text {
            margin-top: 30px;
            font-style: italic;
            color: var(--oman-gold);
            font-weight: bold;
        }

        /* لمسة جمالية سفلية */
        .bottom-decoration {
            height: 15px;
            background: linear-gradient(to right, var(--oman-green), var(--oman-red), var(--white));
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .year-badge {
            background: var(--oman-green);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-border">
        <div class="year-badge">24 فبراير 2026م</div>
        
        <div class="top-pattern"></div>

        <h1>يوم المعلم العماني</h1>
        <h2>رسالة شكر وتقدير</h2>

        <div class="content">
            تتقدم <span class="school-name">إدارة مدرسة المشاش للتعليم الأساسي</span><br>
            بأسمى آيات التهاني والتبريكات إلى صُنّاع الأجيال ومربي العقول، بمناسبة يومكم الأغر.
            <br><br>
            شكراً لعطائكم المستمر، وإخلاصكم في بناء عمان المستقبل.
        </div>

        <div class="footer-text">
            كل عام وأنتم نبراسُ العلمِ ومنارُ المعرفة
        </div>
    </div>
    <div class="bottom-decoration"></div>
</div>

</body>
</html>
