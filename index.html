<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة التكبير الاحترافية - My Family's Mihrab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #eee; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; text-align: right; gap: 5px; }
        label { font-weight: bold; font-size: 13px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-download { background: #27ae60; } .btn-print { background: #2980b9; }
        
        .preview-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }

        /* خريطة الأصل */
        .img-container { position: relative; display: inline-block; border: 2px solid #000; overflow: hidden; }
        #orig-img { max-width: 100%; height: auto; display: block; }
        .grid-overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:grid; pointer-events:none; }
        .grid-cell { border: 1px solid rgba(255,255,0,0.5); display: flex; align-items: center; justify-content: center; color: yellow; font-weight: bold; text-shadow: 1px 1px 2px #000; }

        /* خريطة الأوراق - دائماً عمودية A4 */
        #pages-view { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; background: #ddd; padding: 10px; }
        .page-tile { border: 1px solid #000; background-color: white; position: relative; overflow: hidden; background-repeat: no-repeat; width: 52.5px; height: 74.25px; /* نسبة A4 عمودي مصغرة */ }
        .page-label { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.7); color: white; padding: 1px 4px; font-size: 9px; z-index: 10; }
        .overlap-marker { position: absolute; background: rgba(189, 195, 199, 0.7); border: 1px dashed red; z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">نظام تكبير اللوحات (A4 عمودي ثابت)</h2>
    
    <div class="controls">
        <div class="input-group">
            <label>1. ارفع الصورة:</label>
            <input type="file" id="fileIn" accept="image/*" onchange="init()">
        </div>
        <div class="input-group">
            <label>2. عرض البوستر النهائي (سم):</label>
            <input type="number" id="wCm" value="60" oninput="render()">
        </div>
        <div class="input-group">
            <label>3. ارتفاع البوستر النهائي (سم):</label>
            <input type="number" id="hCm" value="80" oninput="render()">
        </div>
        <div class="input-group">
            <label>4. شكل البوستر المقترح:</label>
            <select id="posterOrient" onchange="suggestDimensions()">
                <option value="p">طولي (Portrait)</option>
                <option value="l">عرضي (Landscape)</option>
            </select>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-download" onclick="exportDoc(false)">حفظ PDF (أوراق عمودية)</button>
        <button class="btn btn-print" onclick="exportDoc(true)">طباعة فورية</button>
    </div>

    <div class="preview-section">
        <div class="card">
            <h4>توزيع الشبكة على الأصل</h4>
            <div id="wrapper" class="img-container">
                <img id="orig-img">
                <div id="grid-layer" class="grid-overlay"></div>
            </div>
        </div>
        <div class="card">
            <h4>الأوراق المطبوعة (كلها A4 عمودي)</h4>
            <div id="pages-view"></div>
        </div>
    </div>
</div>

<script>
    let imgSource = "";
    const overlapMm = 15;

    function suggestDimensions() {
        const orient = document.getElementById('posterOrient').value;
        const wInput = document.getElementById('wCm');
        const hInput = document.getElementById('hCm');
        if (orient === 'l' && parseFloat(wInput.value) < parseFloat(hInput.value)) {
            [wInput.value, hInput.value] = [hInput.value, wInput.value];
        } else if (orient === 'p' && parseFloat(wInput.value) > parseFloat(hInput.value)) {
            [wInput.value, hInput.value] = [hInput.value, wInput.value];
        }
        render();
    }

    function init() {
        const file = document.getElementById('fileIn').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            imgSource = e.target.result;
            const img = document.getElementById('orig-img');
            img.src = imgSource;
            img.onload = render;
        };
        reader.readAsDataURL(file);
    }

    function render() {
        if (!imgSource) return;
        
        const wTarget = parseFloat(document.getElementById('wCm').value) * 10;
        const hTarget = parseFloat(document.getElementById('hCm').value) * 10;
        
        // الطباعة دائماً A4 عمودي
        const pW = 210; 
        const pH = 297; 
        const effW = pW - overlapMm;
        const effH = pH - overlapMm;

        const cols = Math.ceil(wTarget / effW);
        const rows = Math.ceil(hTarget / effH);

        const layer = document.getElementById('grid-layer');
        layer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        layer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        layer.innerHTML = '';
        for(let i=1; i<=(rows*cols); i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell'; cell.innerText = i;
            layer.appendChild(cell);
        }

        const pagesView = document.getElementById('pages-view');
        pagesView.innerHTML = '';
        const scale = 0.25; 

        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.style.display = 'flex'; rowDiv.style.gap = '5px'; rowDiv.style.marginBottom = '5px';
            for (let c = 0; c < cols; c++) {
                const tile = document.createElement('div');
                tile.className = 'page-tile';
                tile.style.width = pW * scale + 'px';
                tile.style.height = pH * scale + 'px';
                
                tile.style.backgroundImage = `url(${imgSource})`;
                tile.style.backgroundSize = `${(wTarget * scale)}px ${(hTarget * scale)}px`;
                tile.style.backgroundPosition = `-${c * effW * scale}px -${r * effH * scale}px`;

                tile.innerHTML = `<div class="page-label">${r*cols+c+1}</div>`;

                if (c < cols - 1) {
                    const ov = document.createElement('div'); ov.className = 'overlap-marker';
                    ov.style.right = '0'; ov.style.top = '0'; ov.style.width = overlapMm * scale + 'px'; ov.style.height = '100%';
                    tile.appendChild(ov);
                }
                if (r < rows - 1) {
                    const ov = document.createElement('div'); ov.className = 'overlap-marker';
                    ov.style.bottom = '0'; ov.style.left = '0'; ov.style.width = '100%'; ov.style.height = overlapMm * scale + 'px';
                    tile.appendChild(ov);
                }
                rowDiv.appendChild(tile);
            }
            pagesView.appendChild(rowDiv);
        }
    }

    async function exportDoc(isPrint) {
        const { jsPDF } = window.jspdf;
        const img = document.getElementById('orig-img');
        if (!img.src) return;

        const wTarget = parseFloat(document.getElementById('wCm').value) * 10;
        const hTarget = parseFloat(document.getElementById('hCm').value) * 10;

        // وضعية PDF ثابتة عمودية A4
        const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        const pW = 210;
        const pH = 297;
        const effW = pW - overlapMm;
        const effH = pH - overlapMm;
        const cols = Math.ceil(wTarget / effW);
        const rows = Math.ceil(hTarget / effH);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (r > 0 || c > 0) pdf.addPage();
                pdf.addImage(img, 'JPEG', -c * effW, -r * effH, wTarget, hTarget, undefined, 'SLOW');
                
                pdf.setFillColor(200, 200, 200);
                if (c < cols - 1) {
                    pdf.rect(pW - overlapMm, 0, overlapMm, pH, 'F');
                    pdf.setTextColor(255, 255, 255); pdf.text("PASTE HERE", pW - (overlapMm/2), pH/2, { angle: 90, align: 'center' });
                }
                if (r < rows - 1) {
                    pdf.rect(0, pH - overlapMm, pW, overlapMm, 'F');
                    pdf.setTextColor(255, 255, 255); pdf.text("PASTE HERE", pW/2, pH - (overlapMm/2), { align: 'center' });
                }
                pdf.setDrawColor(255, 0, 0); pdf.setLineDashPattern([2, 2], 0);
                if (c < cols - 1) pdf.line(pW - overlapMm, 0, pW - overlapMm, pH);
                if (r < rows - 1) pdf.line(0, pH - overlapMm, pW, pH - overlapMm);

                pdf.setLineDashPattern([], 0); pdf.setTextColor(0, 0, 0);
                pdf.text(`P: ${r * cols + c + 1}`, 5, 10);
            }
        }
        if (isPrint) { pdf.autoPrint(); window.open(pdf.output('bloburl'), '_blank'); }
        else { pdf.save("Mihrab_Poster_Vertical_Pages.pdf"); }
    }
</script>

</body>
</html>
