<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مقسم لوحة "المشاش" - My Family's Mihrab Tools</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
        #preview-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .page-slice { position: relative; border: 1px solid #ccc; background: white; overflow: hidden; }
        .page-slice img { width: 100%; height: auto; display: block; }
        .overlap-zone { position: absolute; bottom: 0; left: 0; right: 0; height: 15px; background: rgba(255, 0, 0, 0.2); border-top: 1px dashed red; pointer-events: none; }
        .page-number { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        @media print {
            .controls, h1, p { display: none; }
            #preview-container { display: block; }
            .page-slice { page-break-after: always; border: none; width: 210mm; height: 297mm; margin: 0; }
        }
    </style>
</head>
<body>
    <h1>أداة تقسيم اللوحة (100×70 سم)</h1>
    <p>قم برفع صورة السكتش وسيتم تقسيمها لـ 16 ورقة A4 جاهزة للطباعة.</p>
    
    <div class="controls">
        <input type="file" id="upload" accept="image/*">
        <button onclick="window.print()">ابدأ الطباعة</button>
    </div>

    <div id="preview-container"></div>

    <script>
        const upload = document.getElementById('upload');
        const container = document.getElementById('preview-container');

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = (event) => {
                container.innerHTML = '';
                // تقسيم 4 أعمدة × 4 صفوف لتغطية مقاس 100*70 تقريباً
                for (let i = 0; i < 16; i++) {
                    const row = Math.floor(i / 4);
                    const col = i % 4;
                    
                    const slice = document.createElement('div');
                    slice.className = 'page-slice';
                    
                    const img = document.createElement('div');
                    img.style.backgroundImage = `url(${event.target.result})`;
                    img.style.backgroundSize = '400% 400%'; // لأننا قسمنا 4*4
                    img.style.backgroundPosition = `${(col * 100) / 3}% ${(row * 100) / 3}%`;
                    img.style.width = '100%';
                    img.style.height = '280mm'; // ارتفاع A4 تقريباً
                    
                    const num = document.createElement('div');
                    num.className = 'page-number';
                    num.innerText = `صفحة ${i + 1} (صف ${row + 1} - عمود ${col + 1})`;
                    
                    const overlap = document.createElement('div');
                    overlap.className = 'overlap-zone';
                    overlap.innerText = "منطقة تراكب للقص";
                    overlap.style.fontSize = "10px";
                    overlap.style.color = "red";

                    slice.appendChild(num);
                    slice.appendChild(img);
                    slice.appendChild(overlap);
                    container.appendChild(slice);
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
