<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مقسم اللوحات الذكي - My Family's Mihrab</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .no-print { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; margin-bottom: 20px; max-width: 80%; }
        .page-slice { 
            position: relative; 
            width: 210mm; 
            height: 297mm; 
            margin: 10px auto; 
            background: white; 
            overflow: hidden; 
            border: 1px solid #ddd;
            page-break-after: always;
            display: flex;
            flex-direction: column;
        }
        /* حاوية الصورة للتحكم في الجزء الظاهر */
        .image-container {
            width: 100%;
            height: 95%; /* ترك مساحة للترقيم */
            overflow: hidden;
            position: relative;
        }
        .image-container img {
            position: absolute;
            width: 400%; /* لأننا نقسم 4 أعمدة */
            height: 400%; /* لأننا نقسم 4 صفوف */
            display: block;
        }
        .overlap-indicator {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20mm;
            background: rgba(255, 0, 0, 0.15);
            border-top: 2px dashed red;
            display: flex;
            align-items: center;
            justify-content: center;
            color: red;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }
        .page-info {
            background: #333;
            color: white;
            padding: 10px;
            font-size: 18px;
            text-align: center;
        }
        @media print {
            body { background: none; padding: 0; }
            .no-print { display: none; }
            .page-slice { margin: 0; border: none; }
            /* إجبار المتصفح على طباعة الألوان والخلفيات */
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>أداة تقسيم اللوحة الفنية (100×70 سم)</h1>
        <p>هذا التحديث يحل مشكلة الصفحات الفارغة عبر استخدام تقنية الصور المباشرة.</p>
        <input type="file" id="upload" accept="image/*" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        <br><br>
        <button onclick="window.print()" style="padding: 10px 30px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">إرسال إلى الطابعة</button>
    </div>

    <div id="output"></div>

    <script>
        const upload = document.getElementById('upload');
        const output = document.getElementById('output');

        upload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                output.innerHTML = '';
                const imageUrl = event.target.result;

                // إنشاء 16 صفحة (4 صفوف × 4 أعمدة)
                for (let row = 0; row < 4; row++) {
                    for (let col = 0; col < 4; col++) {
                        const pageNumber = (row * 4) + col + 1;
                        
                        const slice = document.createElement('div');
                        slice.className = 'page-slice';

                        // معلومات الصفحة
                        const info = document.createElement('div');
                        info.className = 'page-info';
                        info.innerText = `الورقة رقم: ${pageNumber} (الصف ${row + 1} - العمود ${col + 1})`;

                        // حاوية الصورة
                        const imgContainer = document.createElement('div');
                        imgContainer.className = 'image-container';

                        const img = document.createElement('img');
                        img.src = imageUrl;
                        // تحريك الصورة لعرض الجزء المناسب فقط
                        img.style.left = `-${col * 100}%`;
                        img.style.top = `-${row * 100}%`;

                        // منطقة التراكب
                        const overlap = document.createElement('div');
                        overlap.className = 'overlap-indicator';
                        overlap.innerText = "قص هنا وضعه فوق الورقة التالية ↑";

                        imgContainer.appendChild(img);
                        slice.appendChild(info);
                        slice.appendChild(imgContainer);
                        slice.appendChild(overlap);
                        
                        output.appendChild(slice);
                    }
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
