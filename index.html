<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>دفتر رمضان 1447هـ (2026) — بلانر iPad 10.2 (Landscape) بإمساكية مُقشن</title>

  <!-- ✅ خطوط Google: تحميل صحيح -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet" />

  <!-- ✅ مكتبات التوليد (بالترتيب) -->
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <style>
    :root{
      /* ألوان — عدّل كما تحب */
      --primary:#1a4d2e; --gold:#c5a059; --gold-light:#e6cc92; --bg:#f9f6f0;
      --card:#ffffff; --text:#1a4d2e; --muted:#6f7b7a; --border:#e6e2d9;
      --shadow: 0 10px 24px rgba(26,77,46,.10), 0 2px 8px rgba(26,77,46,.08);
      --inner: inset 0 1px 0 rgba(255,255,255,.65), inset 0 -1px 0 rgba(0,0,0,.05);

      /* iPad 10.2 — Landscape النهائي */
      --ipad-w: 2160px;
      --ipad-h: 1620px;

      /* المعاينة (نصف الحجم لسرعة التصفح) */
      --preview-w: 1080px; /* 2160 / 2 */
      --preview-h: 810px;  /* 1620 / 2 */
    }

    *{ box-sizing:border-box }
    body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.7 'Amiri', serif }
    .wrap{ max-width:1200px; margin:auto; padding:16px }

    .header{
      background:linear-gradient(135deg,var(--primary),#0a2b1a); color:#fff;
      border:2px solid var(--gold); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow)
    }
    .header h1{ margin:0 0 8px 0; font-family:'Reem Kufi',sans-serif; color:var(--gold-light); font-size:22px }
    .sub{
      background:rgba(255,255,255,.08); border:1px solid rgba(197,160,89,.35);
      padding:8px; border-radius:10px; font-size:.95rem
    }
    .tools{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px }
    .btn{
      border:1px solid var(--gold); background:linear-gradient(180deg,#ffe9b9,#e7cb83);
      color:#1a1a1a; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:700; box-shadow:var(--shadow)
    }
    .btn.ghost{ background:#fff5d9 }

    /* صفحات البلانر — معاينة نصفية */
    #planner{ display:block }
    .page{
      width:var(--preview-w);
      min-height:var(--preview-h); /* منع القصّ: تتمدّد عند الحاجة */
      height:auto;
      background:var(--card); border:1.5px solid var(--border); border-radius:14px;
      margin:12px auto; padding:12px; position:relative; box-shadow:var(--shadow);
      display:flex; flex-direction:column; gap:10px;
    }

    /* رأس الصفحة */
    .band{
      background: radial-gradient(70% 110% at 100% 0%, #2e6f4b 0%, #1a4d2e 55%, #0f2e1b 100%);
      color:#fff; border:2px solid var(--gold);
      border-radius:12px; padding:10px 12px; margin-bottom:4px;
      font-family:'Reem Kufi',sans-serif; display:flex; align-items:center; justify-content:space-between;
      box-shadow:var(--inner), var(--shadow);
    }
    .today-badge{
      display:inline-block; margin-inline-start:8px;
      background:linear-gradient(180deg,#ffe9b9,#e7cb83); color:#1a1a1a;
      border:1px solid var(--gold); border-radius:999px; padding:3px 10px; font-weight:800; box-shadow:var(--shadow); font-size:12px
    }

    /* بطاقات */
    .card{
      border:1.4px solid var(--gold); border-radius:14px; padding:10px;
      background:linear-gradient(180deg,#ffffff 0%, #fffdf6 100%);
      box-shadow:var(--shadow); position:relative; overflow:visible; /* منع القص داخل البطاقة */
    }
    .section-title{
      margin:0 0 8px 0; background:linear-gradient(90deg, #1a4d2e, #235f3a); color:#fff;
      padding:6px 10px; border-radius:9px; font-family:'Reem Kufi',sans-serif; font-size:14px; box-shadow: var(--inner);
    }
    .grid-3{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px }

    /* جداول */
    .table{ width:100%; border-collapse:collapse; font-size:13px }
    .table th,.table td{ border-bottom:1px solid var(--border); padding:6px }
    .table th{ background:linear-gradient(180deg,#f5f2ea,#ebe4d2); color:#2a2a2a; text-align:center; border:1px solid #efe8d6 }
    .table td:first-child{ font-weight:700 }

    /* مربعات التأشير */
    .checkbox{ display:inline-block; width:15px; height:15px; border:1.7px solid var(--gold); border-radius:4px; margin-inline-start:6px }

    /* السنن / الأذكار */
    .sunnah-row,.zikr-row{ display:flex; gap:8px; align-items:center; justify-content:space-between; padding:4px 0; border-bottom:1px dashed var(--border); font-size:13px }
    .sunnah-label{ font-size:13.2px }
    .rb{ display:flex; gap:5px; align-items:center }

    /* أشرطة (ورد/تراويح) — 30 خانة واضحة */
    .qstrip{ display:grid; grid-template-columns:repeat(30, 1fr); gap:3px; margin-top:4px }
    .qcell{
      border:1.3px dashed var(--gold);
      height:16px; border-radius:7px;
      display:flex; align-items:center; justify-content:center;
      color:#8c7a46; font-weight:700; font-size:10.5px; background:#fff; position:relative
    }
    .qcell.current{ background: linear-gradient(180deg,#1a4d2e,#0f2e1b); color:#fff; border-color:var(--gold) }
    .qcell.current::after{
      content:'اليوم'; position:absolute; bottom:-18px; background:linear-gradient(180deg,#ffe9b9,#e7cb83);
      color:#1a1a1a; border:1px solid var(--gold); border-radius:6px; padding:1px 6px; font-size:9.5px; font-weight:800;
    }

    /* إمساكية مصغّرة */
    .imsak-mini{
      display:grid; grid-template-columns:repeat(8, auto); gap:6px; align-items:center;
      background:linear-gradient(180deg,#ffffff,#fff8e6);
      border:1.6px solid var(--gold); border-radius:12px; padding:6px 8px; font-size:12.5px; box-shadow:var(--inner), var(--shadow)
    }
    .imsak-mini .k{ color:#2a2a2a; background:linear-gradient(180deg,#f7f3e6,#efe5c8); border:1px solid var(--border); border-radius:8px; padding:3px 8px; text-align:center; font-weight:700 }
    .imsak-mini .v{ color:#1f2937; border-bottom:1px dashed var(--border); padding:0 6px; text-align:center; font-weight:700; white-space:nowrap; min-width:64px }

    /* التقاط خارج الشاشة وقت التصدير */
    #planner.offscreen-render{
      position:fixed !important; left:-99999px !important; top:0 !important;
      display:block !important; visibility:visible !important; opacity:1 !important;
    }

    /* الطباعة (تطبع المعاينة النصفية) */
    @media print{
      .tools{display:none !important}
      @page{ size: 1080px 810px; margin:10mm }
      .page{ page-break-after:always; box-shadow:none; border-color:#ddd }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>دفتر رمضان 1447هـ (2026) — بلانر iPad 10.2 (Landscape) بإمساكية «مُقشن / ظفار»</h1>
      <div class="sub">
        يبدأ من <b>الخميس 19-02-2026</b> لمدة <b>30 يومًا</b>. الإمساكية بصيغة <b>١٢ ساعة (ص/م)</b> مع أرقام عربية. السحور المقترح = <b>الفجر − 10 دقائق</b>.
      </div>
      <div class="tools">
        <button class="btn" id="btnPreview">معاينة (بناء وإظهار الصفحات)</button>
        <button class="btn" id="btnExportAll">توليد وتحمـيل PDF (iPad 10.2 — Landscape)</button>
        <button class="btn ghost" id="btnExportOne">تصدير صفحة واحدة (PDF)</button>
        <button class="btn ghost" id="btnPrint">طباعة</button>
      </div>
    </div>

    <div id="planner"><!-- تُبنى الصفحات هنا --></div>
  </div>

<script>
/* نشغّل الكود بعد تحميل الصفحة ومكتبات الطرف الثالث */
window.addEventListener('load', () => {

/* ================= إعدادات عامة ================= */
/* تم إضافة المتمّم لشعبان: 18-02-2026 */
const SHAABAN_COMPLETION = new Date('2026-02-18T00:00:00');  // المتمّم
const RAMADAN_START      = new Date('2026-02-19T00:00:00');  // 1 رمضان

/* نبدأ البناء من المتمّم، وننشئ 31 صفحة (1 + 30) */
const START = SHAABAN_COMPLETION;
const DAYS  = 31;

/* مُقشن */
const MUQSHIN = { lat: 19.56364, lon: 54.8916 };
const TZ = 4; // Asia/Muscat (UTC+4)
const SUHOOR_OFFSET_MIN = 10;

/* إخراج PDF (iPad 10.2 — Landscape) */
const PDF_UNIT = 'px';
const PDF_SIZE = [2160, 1620];   // [width, height]
const PDF_ORI  = 'landscape';
const PAGE_W = PDF_SIZE[0], PAGE_H = PDF_SIZE[1];

/* أدوات */
const AR_DIG = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const toArabicDigits = (s)=> String(s).replace(/\d/g, d=>AR_DIG[d]);
function format12hArabic(hhmm){
  if(!/^\d{2}:\d{2}$/.test(hhmm)) return hhmm;
  let [h,m] = hhmm.split(':').map(Number);
  const suf = (h===0 || h<12) ? 'ص' : 'م';
  h = (h%12)||12;
  return toArabicDigits(`${h}:${String(m).padStart(2,'0')} ${suf}`);
}
function hmMinus(hhmm, minutes=10){
  const [h,m]=hhmm.split(':').map(Number);
  const t=h*60+m-minutes; const hh=((t%1440)+1440)%1440/60|0; const mm=((t%60)+60)%60;
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}
function nowInMuscat(){ return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Muscat' })); }
function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

/* اليوم الحالي داخل رمضان فقط (1..30) */
function ramadanTodayIndex(){
  const t=dateOnly(nowInMuscat()), s=dateOnly(RAMADAN_START);
  const diff=Math.floor((t-s)/86400000);
  return (diff>=0 && diff<30) ? diff+1 : null;
}

/* ====== الحساب الفلكي مع تصحيح العصر (ظلّ كلّه) ====== */
const PrayTimes=(function(){
  const D2R=Math.PI/180, R2D=180/Math.PI;
  const J=(y,m,d)=>{ if(m<=2){y-=1;m+=12} const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
    return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; };
  const fixH=(a)=>{ a=a-24*Math.floor(a/24); return a<0?a+24:a; };
  const s=(x)=>Math.sin(x*D2R), c=(x)=>Math.cos(x*D2R), asn=(x)=>R2D*Math.asin(x), acs=(x)=>R2D*Math.acos(x), at2=(y,x)=>R2D*Math.atan2(y,x);
  const fixAng=(a)=>{a=a-360*Math.floor(a/360);return a<0?a+360:a};

  function sunPos(j){
    const D=j-2451545, g=fixAng(357.529+0.98560028*D), q=fixAng(280.459+0.98564736*D),
          L=fixAng(q+1.915*s(g)+0.020*s(2*g)), e=23.439-0.00000036*D,
          RA=at2(c(e)*s(L),c(L))/15, decl=asn(s(e)*s(L)), EqT=q/15-fixH(RA);
    return {decl, EqT};
  }
  function hourAngleByAltitude(altDeg, latDeg, declDeg){
    const D2R=Math.PI/180, R2D=180/Math.PI;
    const alt=altDeg*D2R, lat=latDeg*D2R, dec=declDeg*D2R;
    const term = (Math.sin(alt) - Math.sin(lat)*Math.sin(dec)) / (Math.cos(lat)*Math.cos(dec));
    if (term<-1 || term>1) return null;
    return Math.acos(term)*R2D/15; // ساعات
  }
  function asrHourAngle(latDeg, declDeg, factor=1){
    // ظلّ كلّه: alt_asr = atan( 1 / (factor + tan(|lat - decl|)) )
    const D2R=Math.PI/180, R2D=180/Math.PI;
    const lat=latDeg*D2R, dec=declDeg*D2R;
    const x = Math.abs(Math.tan(lat - dec));
    const alt_asr_rad = Math.atan(1 / (factor + x));
    const alt_asr_deg = alt_asr_rad*R2D;  // ارتفاع موجب
    return hourAngleByAltitude(alt_asr_deg, latDeg, declDeg);
  }
  const timeToStr=(t)=>{ if(t==null||isNaN(t))return'--:--'; t=fixH(t+0.5/60); const h=Math.floor(t),m=Math.floor((t-h)*60); return `${('0'+h).slice(-2)}:${('0'+m).slice(-2)}`; };

  return{
    getTimes:(d,coords,tz)=>{
      const j=J(d.getFullYear(),d.getMonth()+1,d.getDate())-coords.lon/360;
      const {decl,EqT}=sunPos(j);               // decl (deg), EqT (hours)
      const noon=fixH(12-EqT+tz-coords.lon/15); // منتصف النهار الحقيقي
      // شروق/غروب (انكسار جوي: -0.833°)
      const haSun=hourAngleByAltitude(-0.833, coords.lat, decl);
      const sunrise=noon-haSun, sunset=noon+haSun;
      // ✅ عصر ظلّ كلّه (factor=1)
      const haAsr = asrHourAngle(coords.lat, decl, 1);
      const asr = noon + haAsr;
      // فجر 18° — عشاء +90 دقيقة (تقريب محلي)
      const haFajr=hourAngleByAltitude(-18, coords.lat, decl);
      const fajr = haFajr? (noon - haFajr) : (sunrise - 1.5);
      const isha = sunset + 1.5;

      return {Fajr:timeToStr(fajr),Sunrise:timeToStr(sunrise),Dhuhr:timeToStr(noon),Asr:timeToStr(asr),Maghrib:timeToStr(sunset),Isha:timeToStr(isha)};
    }
  };
})();

/* ====== أدوات بناء المكوّنات ====== */
const el=(tag,attrs={},...children)=>{
  const E=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') E.className=v; else if(k==='style') E.setAttribute('style',v); else E.setAttribute(k,v);
  });
  children.forEach(c=>{ if(typeof c==='string') E.appendChild(document.createTextNode(c)); else if(c) E.appendChild(c); });
  return E;
};
const checkbox=()=> el('span',{class:'checkbox'});
function section(title, content){
  const b=el('div',{class:'card'});
  b.appendChild(el('h3',{class:'section-title'}, title));
  b.appendChild(content); return b;
}

/* ====== بناء صفحة اليوم بكل البطاقات ====== */
function makePage(idx, dateObj){
  const dayNames=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const isFri = dateObj.getDay()===5;
  const dateStr=`${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
  const isRamadan = (dateObj >= RAMADAN_START);

  const page=el('div',{class:'page','data-date':dateStr});

  // رأس الصفحة
  const band=el('div',{class:'band'});
  let titleText;
  if(!isRamadan){
    titleText = `المتمِّم لشعبان — ${dayNames[dateObj.getDay()]} — ${dateStr}`;
  }else{
    const rIndex = ((dateOnly(dateObj) - dateOnly(RAMADAN_START)) / 86400000 | 0) + 1; // 1..30
    titleText = `اليوم ${toArabicDigits(String(rIndex).padStart(2,'0'))} — ${dayNames[dateObj.getDay()]} — ${dateStr}`;
  }
  const left = el('div',{}, titleText);
  band.appendChild(left);

  const rToday = ramadanTodayIndex(); // 1..30
  if(isRamadan && rToday){
    const rIndex = ((dateOnly(dateObj) - dateOnly(RAMADAN_START)) / 86400000 | 0) + 1;
    if(rIndex===rToday) band.appendChild(el('span',{class:'today-badge'},'اليوم الحالي'));
  }
  page.appendChild(band);

  // شبكة 3 أعمدة
  const grid=el('div',{class:'grid-3'});

  /* 🕋 الفروض */
  const fTbl=el('table',{class:'table'});
  fTbl.innerHTML = `
    <thead><tr><th>الصلاة</th><th>م</th><th>ج</th><th>ف</th><th>ق</th></tr></thead>
    <tbody>
      ${fRow('الفجر')}
      ${fRow(isFri? 'الجمعة' : 'الظهر')}
      ${fRow('العصر')}
      ${fRow('المغرب')}
      ${fRow('العشاء')}
    </tbody>`;
  function fRow(name){ return `<tr><td style="text-align:right">${name}</td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td></tr>`; }
  grid.appendChild(section('🕋 الفروض (م=مسجد | ج=جماعة | ف=فرد | ق=قضاء)', fTbl));

  /* 🌱 السنن الرواتب والنوافل (مع الشفع والوتر + الضحى) */
  const sBox=el('div',{}), sList=[];
  sList.push({label:'الفجر', sub:'قبلية', count:2});
  if(isFri){ sList.push({label:'الجمعة', sub:'بعدية', count:4, note:'٢ أو ٤'}); }
  else{ sList.push({label:'الظهر', sub:'قبلية', count:4}); sList.push({label:'الظهر', sub:'بعدية', count:2}); }
  sList.push({label:'المغرب', sub:'بعدية', count:2});
  sList.push({label:'العشاء', sub:'بعدية', count:2});
  sList.push({label:'العصر (اختياري)', sub:'قبلية', count:4});
  /* ➕ الضحى (٢–٨) — نعرض مربّعين مع ملاحظة النطاق */
  sList.push({label:'الضحى', sub:'نهارًا', count:2, note:'٢–٨'});
  /* ➕ الشفع والوتر (٣ مربعات) */
  sList.push({label:'الشفع والوتر', sub:'ليلًا', count:3});

  sList.forEach(r=>{
    const row=el('div',{class:'sunnah-row'},
      el('span',{class:'sunnah-label'}, `${r.label}: ${r.sub}${r.note?` (${r.note})`:''}`),
      el('span',{class:'rb'}, ...Array.from({length:r.count},()=>checkbox()))
    );
    sBox.appendChild(row);
  });
  grid.appendChild(section('🌱 السنن الرواتب والنوافل (عدد الركعات — قبلية/بعدية)', sBox));

  /* 📿 بطاقة الأذكار */
  const zBox=el('div',{}); const zList=['☀️ أذكار الصباح','🌙 أذكار المساء','😴 أذكار النوم','📖 سورة الملك (ليلاً)','📖 خواتيم سورة البقرة (285–286)'];
  if(isFri) zList.push('🕌 سورة الكهف (الجمعة)');
  zList.forEach(t=> zBox.appendChild(el('div',{class:'zikr-row'}, el('span',{},t), checkbox())) );
  grid.appendChild(section('📿 بطاقة الأذكار', zBox));

  page.appendChild(grid);

  /* 📖 شريط الورد القرآني (30 خانة) */
  const qstrip=el('div',{class:'qstrip'});
  for(let i=1;i<=30;i++){
    const cell=el('div',{class:'qcell'}, toArabicDigits(i));
    if(rToday && isRamadan && i===rToday) cell.classList.add('current');
    qstrip.appendChild(cell);
  }
  page.appendChild(section('📖 شريط الورد القرآني (الشهر كاملًا — ضع ✓)', qstrip));

  /* 🕌 شريط صلاة التراويح (30 خانة) — نفس أسلوب الورد */
  const tStrip=el('div',{class:'qstrip'});
  for(let i=1;i<=30;i++){
    const cell=el('div',{class:'qcell'}, toArabicDigits(i));
    if(rToday && isRamadan && i===rToday) cell.classList.add('current');
    tStrip.appendChild(cell);
  }
  page.appendChild(section('🕌 شريط صلاة التراويح (ليالي رمضان — ضع ✓)', tStrip));

  /* 🕯️ أدعية ونقاط اليوم */
  const dua=el('div',{},
    el('div',{},'📌 دعاء الإفطار: «ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ العُرُوقُ، وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللهُ».'),
    el('div',{style:'margin-top:4px'},'📌 السحور: لا دعاء مخصوص ثابت؛ «بِسْمِ الله» كباقي الطعام، والسحور بركة.'),
    el('div',{style:'margin-top:6px'},'نقاط اليوم: ____________________________  •  ملاحظات: ______________________________________________')
  );
  page.appendChild(section('🕯️ أدعية ونقاط اليوم', dua));

  /* 🕰️ الإمساكية اليومية (12 ساعة) */
  const imsTbl=el('table',{class:'table'});
  const t = PrayTimes.getTimes(dateObj, MUQSHIN, TZ);
  const imsak  = hmMinus(t.Fajr, 10);
  const suhoor = hmMinus(t.Fajr, SUHOOR_OFFSET_MIN);
  imsTbl.innerHTML = `
    <thead><tr>
      <th>الإمساك</th><th>السحور*</th><th>الفجر</th><th>الشروق</th><th>${isFri?'الجمعة':'الظهر'}</th><th>العصر</th><th>المغرب</th><th>العشاء</th>
    </tr></thead>
    <tbody><tr>
      <td style="text-align:center">${format12hArabic(imsak)}</td>
      <td style="text-align:center">${format12hArabic(suhoor)}</td>
      <td style="text-align:center">${format12hArabic(t.Fajr)}</td>
      <td style="text-align:center">${format12hArabic(t.Sunrise)}</td>
      <td style="text-align:center">${format12hArabic(t.Dhuhr)}</td>
      <td style="text-align:center">${format12hArabic(t.Asr)}</td>
      <td style="text-align:center">${format12hArabic(t.Maghrib)}</td>
      <td style="text-align:center">${format12hArabic(t.Isha)}</td>
    </tr></tbody>`;
  page.appendChild(section('🕰️ الإمساكية اليومية (مُقشن — ١٢ ساعة)', imsTbl));

  return page;
}

/* ====== بناء كل الصفحات ====== */
async function buildAll(){
  const host=document.getElementById('planner');
  if(host.childElementCount>0) return;
  for(let i=0;i<DAYS;i++){
    const d=new Date(START); d.setDate(START.getDate()+i);
    host.appendChild(makePage(i+1, d));
  }
}

/* ====== لقطات عالية الدقة لمقاس iPad 10.2 — Landscape ====== */
async function snapshotAsIPad(node){
  // المعاينة نصفية (1080×810)؛ نضبط scale ليصبح الالتقاط 2160×1620
  const previewW = parseFloat(getComputedStyle(node).width); // 1080px
  const scale = PAGE_W / previewW; // 2160 / 1080 = 2
  const canvas = await html2canvas(node, { scale, useCORS:true, backgroundColor:'#ffffff' });
  return { data: canvas.toDataURL('image/png'), w: canvas.width, h: canvas.height };
}

/* ====== PDF / طباعة ====== */
function libsReady(){ return !!(window.jspdf && window.jspdf.jsPDF && window.html2canvas); }

/* ملاءمة الصورة داخل صفحة PDF بدون قصّ أو تمديد */
function addImageFit(pdf, imgData, imgPxW, imgPxH, pagePxW, pagePxH){
  const imgAspect  = imgPxW / imgPxH;
  const pageAspect = pagePxW / pagePxH;
  let w = pagePxW, h = pagePxH;
  if (imgAspect > pageAspect) h = w / imgAspect; else w = h * imgAspect;
  const x = (pagePxW - w) / 2, y = (pagePxH - h) / 2;
  pdf.addImage(imgData, 'PNG', x, y, w, h);
}

async function exportAllPDF(){
  if(!libsReady()){ alert('المكتبات لم تُحمّل بعد. أعد تحميل الصفحة ثم جرّب.'); return; }
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
  await buildAll();

  const host=document.getElementById('planner');
  host.classList.add('offscreen-render'); // اجعلها مرئية خارج الشاشة وقت الالتقاط
  await new Promise(r=>requestAnimationFrame(r));

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:PDF_ORI, unit:PDF_UNIT, format:PDF_SIZE});
  const pages = [...document.querySelectorAll('#planner .page')];

  for(let i=0;i<pages.length;i++){
    const snap = await snapshotAsIPad(pages[i]);
    if(i>0) pdf.addPage(PDF_SIZE, PDF_ORI);
    addImageFit(pdf, snap.data, snap.w, snap.h, PAGE_W, PAGE_H);
  }
  pdf.save('Ramadan_1447_2026_iPad102_Landscape_Muqshin_12h.pdf');

  host.classList.remove('offscreen-render');
}

async function exportOnePDF(){
  if(!libsReady()){ alert('المكتبات لم تُحمّل بعد.'); return; }
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
  await buildAll();

  /* الافتراضي: اليوم الحالي من رمضان إن وُجد، وإلا أول صفحة (المتمّم) */
  let def = ramadanTodayIndex() || 1;
  let day = prompt('أدخل رقم الصفحة المراد تصديرها (1 للمتمّم، 2..31 لرمضان):', String(def));
  if(day===null) return;
  day = parseInt(day,10);
  if(isNaN(day) || day<1 || day> DAYS){ alert('رقم غير صحيح'); return; }

  const host=document.getElementById('planner'); host.classList.add('offscreen-render');
  await new Promise(r=>requestAnimationFrame(r));

  const node = document.querySelectorAll('#planner .page')[day-1];
  const snap = await snapshotAsIPad(node);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:PDF_ORI, unit:PDF_UNIT, format:PDF_SIZE});
  addImageFit(pdf, snap.data, snap.w, snap.h, PAGE_W, PAGE_H);

  const iso = node.dataset.date || '';
  pdf.save(`Ramadan1447_iPad102_Landscape_Muqshin_Page${String(day).padStart(2,'0')}${iso? '_' + iso : ''}.pdf`);

  host.classList.remove('offscreen-render');
}

async function printAll(){
  await buildAll();
  window.print(); // تطبع المعاينة النصفية — للتصدير عالي الدقة استخدم PDF.
}

/* ====== ربط الأزرار ====== */
document.getElementById('btnPreview').addEventListener('click', async ()=>{
  await buildAll();
  const host=document.getElementById('planner');
  host.style.display='block';
  window.scrollTo({ top: host.offsetTop, behavior: 'smooth' });
});
document.getElementById('btnExportAll').addEventListener('click', exportAllPDF);
document.getElementById('btnExportOne').addEventListener('click', exportOnePDF);
document.getElementById('btnPrint').addEventListener('click', printAll);

}); // load
