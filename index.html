<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Planner Generator Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div style="padding: 50px; text-align: center;">
        <h1>MYH Planner Generator (Direct PDF)</h1>
        <button onclick="generatePDF()" style="padding: 20px; font-size: 20px; cursor: pointer; background: red; color: white;">توليد ملف الـ PDF الآن</button>
        <p id="status"></p>
    </div>

    <script>
        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4'); // l = landscape, mm = مليمتر
            const status = document.getElementById('status');

            status.textContent = "جاري البناء، يرجى الانتظار...";

            const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

            // حلقة تكرارية لبناء الشهور والأيام
            for (let m = 0; m < months.length; m++) {
                let days = new Date(2026, m + 1, 0).getDate();
                
                for (let d = 1; d <= days; d++) {
                    // إضافة صفحة جديدة (لا نضيف صفحة قبل الأولى)
                    if (m > 0 || d > 1) doc.addPage();
                    
                    // رسم المحتوى
                    doc.setFontSize(20);
                    doc.text(`شهر ${months[m]} - يوم ${d}`, 20, 20);
                    doc.setFontSize(12);
                    doc.text("هذا البلانر تم إنشاؤه ببرمجة مباشرة لضمان عدم حدوث أخطاء.", 20, 40);
                    
                    // إمكانية إضافة إحداثيات للروابط (Anchors)
                    // doc.link(20, 50, 50, 10, { url: '#index' }); 
                }
            }

            // حفظ الملف
            doc.save('MYH_Planner_2026.pdf');
            status.textContent = "تم بنجاح! الملف جاهز للتحميل.";
        }
    </script>
</body>
</html>
