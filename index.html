<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>دفتر رمضان 1447هـ (2026) – بلانر Landscape مع إمساكية يومية</title>

<!-- خطوط -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">

<!-- jsPDF + html2canvas للتصدير PDF -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root{
  /* لوحة الألوان (مثل كودك) */
  --primary:#1a4d2e; --gold:#c5a059; --gold-light:#e6cc92; --bg:#f9f6f0;
  --card:#ffffff; --text:#1a4d2e; --accent:#d35400; --crimson:#900c3f;
  --muted:#6f7b7a; --border:#e6e2d9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 'Amiri', serif}
.wrap{max-width:1100px;margin:auto;padding:16px}
.header{
  background:linear-gradient(135deg,var(--primary),#0a2b1a); color:#fff;
  border:2px solid var(--gold); border-radius:14px; padding:14px; margin-bottom:12px
}
.header h1{margin:0 0 6px 0; font-family:'Reem Kufi'; color:var(--gold-light); font-size:22px}
.header .sub{background:rgba(255,255,255,.08); border:1px solid rgba(197,160,89,.35);
  padding:8px; border-radius:10px; font-size:.95rem}
.tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.btn{
  border:1px solid var(--gold); background:var(--gold); color:#1a1a1a;
  padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:700
}
.btn.ghost{background:#fff5d9}
.note{color:#6b6b6b; font-size:.9rem}

/* مقاس صفحة البلانر (A4 landscape تقريبًا عند 96dpi) */
#planner{ display:none }
.page{
  width: 1123px;  /* ~297mm */
  height: 794px;  /* ~210mm */
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  margin: 12px auto; padding: 10px; position: relative; color: var(--text);
}

/* رأس الصفحة */
.header-band{
  background: var(--primary); color:#fff; border: 2px solid var(--gold);
  border-radius: 12px; padding: 10px; margin-bottom: 8px;
}
.h-title{ margin:0; font-size:20px; font-family:'Reem Kufi'; color:var(--gold-light) }

/* بطاقات */
.card{
  border: 1.5px solid var(--gold); border-radius: 12px; padding: 10px; background:#fff; margin-bottom: 8px;
}
.section-title{
  margin:0 0 8px 0; background:var(--primary); color:#fff; padding:6px 8px; border-radius:8px; font-family:'Reem Kufi'
}

/* شبكة / جداول */
.row{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.table{ width:100%; border-collapse:collapse; font-size:14px }
.table th,.table td{ border-bottom:1px solid var(--border); padding:6px 4px }
.table th{ background:#f3efe7; color:#2a2a2a; text-align:center }
.table td:first-child{ font-weight:700 }

/* مربعات التأشير (للاستخدام اليدوي لاحقًا في GoodNotes) */
.checkbox{ display:inline-block; width:18px; height:18px; border:1.8px solid var(--gold); border-radius:3px; margin-inline-start:6px }

/* السنن (قبلية/بعدية + عدد الركعات) */
.sunnah-row{ display:flex; gap:10px; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border) }
.sunnah-label{ font-size:14px }
.rb{ display:flex; gap:6px; align-items:center }

/* الأذكار */
.zikr-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border) }

/* شريط الورد القرآني الأفقي (30 مربعًا) */
.qstrip{ display:grid; grid-template-columns:repeat(30, 1fr); gap:4px; margin-top:4px }
.qcell{ border:1.3px dashed var(--gold); height:18px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#8c7a46; font-weight:700; font-size:11px }

/* صناديق نص */
.input-line{border:1px solid var(--border); border-radius:10px; padding:6px; color:#555; font-size:14px}
.small{font-size:12px; color:#777}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>دفتر رمضان 1447هـ (2026) – بلانر Landscape مع إمساكية يومية</h1>
    <div class="sub">
      يبدأ من <b>الخميس 19-02-2026</b> لمدة <b>30 يومًا</b> – في كل صفحة: إمساكية اليوم، بطاقات العبادات، شريط الورد (30 مربعًا)، وأدعية السحور والإفطار.  
      يوم <b>الجمعة</b> يتحول الظهر → <b>الجمعة</b> وتُضاف <b>سورة الكهف</b> ضمن الأذكار.
    </div>
    <div class="tools">
      <button class="btn" id="btnMake">توليد وتحميل PDF</button>
      <button class="btn ghost" id="btnPreview">معاينة (إظهار الصفحات)</button>
    </div>
  </div>

  <div id="planner" aria-hidden="true"></div>
</div>

<script>
/* ================= إعدادات عامة ================= */
const START = new Date('2026-02-19T00:00:00'); // بداية رمضان
const DAYS  = 30;                               // عدد الأيام
const A4W = 297, A4H = 210;                     // mm للـPDF landscape

/* ================ أدوات بناء عناصر HTML ================ */
function el(tag, attrs={}, ...children){
  const E = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') E.className=v;
    else if(k==='style') E.setAttribute('style',v);
    else E.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(typeof c==='string') E.appendChild(document.createTextNode(c));
    else if(c) E.appendChild(c);
  });
  return E;
}
function headerBand(title){
  return el('div',{class:'header-band'}, el('h3',{class:'h-title'}, title));
}
function checkbox(){ return el('span',{class:'checkbox'}); }
function section(title, content){ return el('div',{class:'card'}, el('h3',{class:'section-title'}, title), content); }

/* ================ صفحات ================== */
function buildDailyPage(dayIndex, dateObj){
  const page = el('div',{class:'page'});

  const weekdayAr = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][dateObj.getDay()];
  const isFriday  = (weekdayAr==='الجمعة');
  const dateStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
  page.appendChild(headerBand(`اليوم ${String(dayIndex).padStart(2,'0')} – ${weekdayAr} – ${dateStr}`));

  /* 1) إمساكية اليوم (جدول مصغر) */
  const imsRows = [
    ['الإمساك (آخر وقت للسحور)', '________ : ______'],
    ['أذان الفجر',                  '________ : ______'],
    ['الشروق',                      '________ : ______'],
    [isFriday? 'الجمعة' : 'الظهر',  '________ : ______'],
    ['العصر',                       '________ : ______'],
    ['المغرب (الإفطار)',            '________ : ______'],
    ['العشاء',                     '________ : ______']
  ];
  const imsTable = el('table',{class:'table'});
  imsTable.innerHTML = `<thead><tr><th>البند</th><th>الوقت</th></tr></thead>`;
  const tb = el('tbody');
  imsRows.forEach(r=>{
    const tr = el('tr',{}, el('td',{},r[0]), el('td',{}, r[1]));
    tb.appendChild(tr);
  });
  imsTable.appendChild(tb);
  page.appendChild(section('🕰️ الإمساكية اليومية', imsTable));

  /* 2) شريط الورد القرآني (30 مربّعًا) */
  const qstrip = el('div',{class:'qstrip'});
  for(let i=1;i<=30;i++) qstrip.appendChild(el('div',{class:'qcell'}, String(i)));
  page.appendChild(section('📖 شريط الورد القرآني (الشهر كاملًا – ضع ✓ في GoodNotes)', qstrip));

  /* 3) بطاقات العبادات */
  const cardsRow = el('div',{class:'row'});

  // (أ) الفروض
  const fTbl = el('table',{class:'table'});
  fTbl.innerHTML = `
    <thead>
      <tr><th>الصلاة</th><th>مسجد</th><th>جماعة</th><th>فرد</th><th>قضاء</th></tr>
    </thead>
    <tbody>
      ${fRow('الفجر')}
      ${fRow(isFriday? 'الجمعة' : 'الظهر')}
      ${fRow('العصر')}
      ${fRow('المغرب')}
      ${fRow('العشاء')}
    </tbody>`;
  function fRow(name){
    return `<tr>
      <td style="text-align:right">${name}</td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
    </tr>`;
  }
  cardsRow.appendChild(section('🕋 الفروض (مسجد | جماعة | فرد | قضاء)', fTbl));

  // (ب) السنن الرواتب (قبلية/بعدية + عدد الركعات)
  const sBox = el('div',{});
  const sList = [];
  sList.push({label:'الفجر', sub:'قبلية', count:2});
  if(isFriday){
    sList.push({label:'الجمعة', sub:'بعدية', count:4, note:'٢ أو ٤'});
  }else{
    sList.push({label:'الظهر', sub:'قبلية', count:4});
    sList.push({label:'الظهر', sub:'بعدية', count:2});
  }
  sList.push({label:'المغرب', sub:'بعدية', count:2});
  sList.push({label:'العشاء', sub:'بعدية', count:2});
  sList.push({label:'العصر (اختياري)', sub:'قبلية', count:4});
  sList.forEach(r=>{
    const line = el('div',{class:'sunnah-row'},
      el('span',{class:'sunnah-label'}, `${r.label}: ${r.sub} ${r.note? `(${r.note})` : ''}`),
      el('span',{class:'rb'}, ...Array.from({length:r.count},()=>checkbox()))
    );
    sBox.appendChild(line);
  });
  cardsRow.appendChild(section('🌱 السنن الرواتب (عدد الركعات – قبلية/بعدية)', sBox));
  page.appendChild(cardsRow);

  // (ج) الأذكار
  const zBox = el('div',{});
  const zList = [
    '☀️ أذكار الصباح', '🌙 أذكار المساء', '😴 أذكار النوم',
    '📖 سورة الملك (ليلاً)', '📖 خواتيم سورة البقرة (285–286)'
  ];
  if(isFriday) zList.push('🕌 سورة الكهف (الجمعة)');
  zList.forEach(t=>{
    const row = el('div',{class:'zikr-row'}, el('span',{}, t), checkbox());
    zBox.appendChild(row);
  });
  page.appendChild(section('📿 الأذكار اليومية', zBox));

  /* 4) أدعية السحور والإفطار (أسفل الصفحة) */
  const dua = el('div',{},
    el('div',{class:'input-line'}, '📌 دعاء الإفطار (ثابت): «ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ العُرُوقُ، وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللهُ»'),
    el('div',{class:'small',style:'margin-top:6px'}, '📌 تذكير السحور: لا دعاء مخصوص ثابت للسحور؛ يُستحب «بِسْمِ الله» عند البدء وحمد الله عند الانتهاء، والسحور بركة.'),
    el('div',{class:'input-line',style:'margin-top:6px'}, 'نقاط اليوم: ____________________________  •  ملاحظات: ______________________________________________')
  );
  page.appendChild(section('🕯️ أدعية ونقاط اليوم', dua));

  return page;
}

/* صفحات الغلاف/الفهرس مختصرة (اختياري) — سنكتفي باليومي فقط حسب طلبك */

/* بناء جميع الصفحات */
async function buildAllPages(previewOnly=false){
  const host = document.getElementById('planner');
  if(host.childElementCount>0) return;
  host.style.display = previewOnly ? 'block' : 'none';

  for(let i=0;i<DAYS;i++){
    const d = new Date(START); d.setDate(START.getDate()+i);
    host.appendChild(buildDailyPage(i+1, d));
    // للمعاينة: لا نقيّد، سنعرض الكلّ لأن التحرير لاحقًا سيتم في GoodNotes
  }
}

/* تصدير PDF */
async function exportPDF(){
  await buildAllPages(false);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const pages = [...document.querySelectorAll('#planner .page')];

  for(let i=0;i<pages.length;i++){
    const node = pages[i];
    await document.fonts?.ready;
    const canvas = await html2canvas(node, {scale:2, useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    if(i>0) pdf.addPage('a4','landscape');
    pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
  }
  pdf.save('Ramadan_1447_2026_Landscape_Planner.pdf');
}

/* أزرار الواجهة */
document.getElementById('btnPreview').onclick = ()=> buildAllPages(true).then(()=>{
  const host = document.getElementById('planner'); host.style.display='block';
  window.scrollTo({top: host.offsetTop, behavior: 'smooth'});
});
document.getElementById('btnMake').onclick = ()=> exportPDF();
</script>
</body>
</html>
