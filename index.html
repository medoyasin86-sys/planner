<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>هيدر جدول — صف علوي للحصص رأسياً وصف سفلي للأوقات رأسياً</title>
  <style>
    :root{
      /* تحكم سريع بالحجم والمسافات */
      --banner-width: 1080px; /* عرض الهيدر */
      --card-size: 56px;      /* مقاس البطاقة (مربع) — صغّره لـ 52 أو 48 للنحافة */
      --gap: 6px;             /* مسافة بين الأعمدة والصفوف */
      --radius: 8px;

      /* الألوان المطلوبة */
      --ruby: #8b002b;        /* ياقوتي للحصص */
      --ruby-ink: #ffffff;    /* نص أبيض على الياقوتي */
      --cream: #faeedb;       /* كريمي للأوقات */
      --cream-ink: #8b002b;   /* نص ياقوتي على الكريمي */

      /* إطار وورقة */
      --frame-bg: #ffffff;
      --frame-border: #d8c8be;
      --page-bg: #f7f3f1;
    }

    html, body{
      margin: 0; padding: 0;
      background: var(--page-bg);
      font-family: "Cairo", "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    /* إطار الهيدر */
    .header-wrap{
      width: min(96vw, var(--banner-width));
      margin: 16px auto;
      padding: 10px;
      background: var(--frame-bg);
      border: 1px solid var(--frame-border);
      border-radius: 12px;
      box-sizing: border-box;
    }

    /* شبكة أفقية بصفّين و10 أعمدة ثابتة */
    .grid{
      display: grid;
      grid-template-columns: repeat(10, var(--card-size));
      grid-template-rows: var(--card-size) var(--card-size);
      gap: var(--gap);
      justify-content: start; /* يضمن بقاء الجدول أفقيًا دون تمدد غريب */
      align-items: start;
    }

    /* بطاقة عامة — مربعة، دون تداخل أو قص */
    .card{
      width: var(--card-size);
      height: var(--card-size);
      border-radius: calc(var(--radius) - 2px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 6px;          /* يمنع قص الأحرف من الحواف */
      overflow: visible;     /* يضمن عدم قص أي عنصر داخلي */
      border: 1px solid rgba(0,0,0,0.08);
    }

    /* بطاقات الصف العلوي (الحصص) — ياقوتي مع نص أبيض */
    .card.mark{
      background: var(--ruby);
      color: var(--ruby-ink);
      border-color: #6a001f;
    }

    /* بطاقات الصف السفلي (الأوقات) — كريمي مع نص ياقوتي */
    .card.time{
      background: var(--cream);
      color: var(--cream-ink);
      border-color: #e8d8c8;
    }

    /* محتوى رأسي بالكامل داخل البطاقات */
    .vstack{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* اجعل النص عمودي بوضوح وثبات */
      writing-mode: vertical-rl;
      text-orientation: upright; /* الأرقام/الحروف تظهر مستقيمة رأسياً */
      line-height: 1;
      letter-spacing: 0;
      gap: 6px;
    }

    /* الرقم/الحرف — كبير وواضح */
    .mark-text{
      font-weight: 900;
      font-size: 18px;
    }

    /* الوقت — واضح وعريض أيضًا وبنفس الاتجاه الرأسي */
    .time-text{
      font-weight: 900;
      font-size: 13px; /* كبّره إلى 14 إن رغبت */
    }

    /* للطباعة إن احتجت تصدير PDF */
    @media print{
      body{ background: #fff; }
      .header-wrap{ width: 180mm; padding: 6mm; border-radius: 6mm; }
    }
  </style>
</head>
<body>

  <div class="header-wrap" aria-label="هيدر جدول أفقي — صف علوي للحصص وصف سفلي للأوقات">
    <div class="grid">
      <!-- ===== الصف العلوي: الحصص (ياقوتي/نص أبيض) ===== -->
      <div class="card mark"><div class="vstack"><div class="mark-text">ط</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">1</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">2</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">3</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">4</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">ف</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">5</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">6</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">7</div></div></div>
      <div class="card mark"><div class="vstack"><div class="mark-text">8</div></div></div>

      <!-- ===== الصف السفلي: الأوقات (كريمي/نص ياقوتي) ===== -->
      <div class="card time"><div class="vstack"><div class="time-text">7:30–7:40</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">7:40–8:15</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">8:15–8:50</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">8:50–9:25</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">9:25–10:00</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">10:00–10:10</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">10:10–10:45</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">10:45–11:20</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">11:20–11:55</div></div></div>
      <div class="card time"><div class="vstack"><div class="time-text">11:55–12:30</div></div></div>
    </div>
  </div>

</body>
</html>
