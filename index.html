<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYH Art Planner 2026-2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #dcdbd3; color: #2d2d2d; user-select: none; }
        
        /* أبعاد شاشة iPad 10.2 الثابتة بنسبة 4:3 لمنع التمرير */
        .ipad-container { width: 1024px; height: 768px; max-width: 1024px; max-height: 768px; background-color: #fcfbf9; }
        
        /* أسطر الدفاتر الرقمية لراحة قلم الآيباد */
        .handwriting-lines {
            background-image: linear-gradient(#e6e5df 1px, transparent 1px);
            background-size: 100% 24px;
            line-height: 24px;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2">

    <div class="ipad-container shadow-2xl rounded-xl overflow-hidden flex flex-row relative border border-stone-300">
        
        <aside class="w-20 bg-[#1e2421] text-stone-300 flex flex-col items-center py-4 justify-between z-10 border-l border-stone-800">
            <div class="flex flex-col items-center gap-1 w-full">
                <span class="text-sm font-black text-[#d4af37] tracking-wider mb-3">MYH</span>
                <button onclick="switchView('yearly')" class="w-full py-1.5 text-[11px] font-bold text-center hover:bg-stone-800 transition mb-2 border-b border-stone-800 pb-2">التقويم</button>
                
                <div class="flex flex-col gap-0.5 w-full overflow-y-auto hide-scrollbar max-h-[460px]">
                    <button onclick="goToMonth(2026, 6)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2026-6">يوليو 26</button>
                    <button onclick="goToMonth(2026, 7)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2026-7">أغسطس</button>
                    <button onclick="goToMonth(2026, 8)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2026-8">سبتمبر</button>
                    <button onclick="goToMonth(2026, 9)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2026-9">أكتوبر</button>
                    <button onclick="goToMonth(2026, 10)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2026-10">نوفمبر</button>
                    <button onclick="goToMonth(2026, 11)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2026-11">ديسمبر</button>
                    <button onclick="goToMonth(2027, 0)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2027-0">يناير 27</button>
                    <button onclick="goToMonth(2027, 1)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2027-1">فبراير</button>
                    <button onclick="goToMonth(2027, 2)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2027-2">مارس</button>
                    <button onclick="goToMonth(2027, 3)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2027-3">أبريل</button>
                    <button onclick="goToMonth(2027, 4)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2027-4">مايو</button>
                    <button onclick="goToMonth(2027, 5)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2027-5">يونيو</button>
                    <button onclick="goToMonth(2027, 6)" class="month-tab w-full py-2 text-[11px] text-center hover:bg-stone-800" data-m="2027-6">يوليو 27</button>
                </div>
            </div>
            <button onclick="switchView('daily')" class="w-full py-3 text-[12px] font-bold text-center bg-[#29332f] text-[#d4af37] hover:bg-stone-700 transition rounded-b">اليوم الحالى</button>
        </aside>

        <main class="flex-1 flex flex-col p-4 justify-between overflow-hidden">
            
            <div id="view-yearly" class="view-content flex-1 flex flex-col justify-center">
                <h1 class="text-base font-bold text-center text-stone-800 mb-3">التقويم السنوي التفاعلي ٢٠٢٦ - ٢٠٢٧</h1>
                <div class="grid grid-cols-4 gap-2 overflow-y-auto max-h-[620px] p-1" id="yearly-grid"></div>
            </div>

            <div id="view-daily" class="view-content flex-1 hidden flex flex-col justify-between">
                
                <div class="grid grid-cols-12 gap-4 items-center border-b-2 border-stone-200 pb-3 mb-2">
                    
                    <div class="col-span-3 flex justify-center">
                        <div class="w-32 bg-white rounded-lg shadow-md border border-stone-300 overflow-hidden text-center">
                            <div class="bg-red-700 text-white py-1 text-[11px] font-bold uppercase tracking-wider" id="calendar-top-month">يوليو ٢٠٢٦</div>
                            <div class="py-2 bg-stone-50">
                                <div class="text-3xl font-black text-stone-800 leading-none" id="calendar-main-day">١٥</div>
                                <div class="text-[11px] font-bold text-stone-500 mt-1" id="calendar-day-name">الأربعاء</div>
                            </div>
                        </div>
                    </div>

                    <div class="col-span-9 bg-white p-2 rounded-lg border border-stone-200 shadow-sm">
                        <div class="grid grid-cols-8 gap-1 text-center text-[10px] font-bold text-stone-400 mb-1">
                            <div>١</div><div>٢</div><div>٣</div><div>٤</div><div>٥</div><div>٦</div><div>٧</div><div>٨</div>
                        </div>
                        <div class="grid grid-cols-8 gap-1 border-t border-stone-200 pt-1 h-10">
                            <div class="border-r border-l border-stone-100"></div>
                            <div class="border-r border-stone-100"></div>
                            <div class="border-r border-stone-100"></div>
                            <div class="border-r border-stone-100"></div>
                            <div class="border-r border-stone-100"></div>
                            <div class="border-r border-stone-100"></div>
                            <div class="border-r border-stone-100"></div>
                            <div class="border-l border-stone-100"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-12 gap-4 flex-1 items-stretch overflow-hidden">
                    
                    <div class="col-span-7 bg-white p-3 rounded-lg border border-stone-200 shadow-sm flex flex-col">
                        <div class="handwriting-lines flex-1 opacity-80" style="background-size: 100% 22px; line-height: 22px;"></div>
                    </div>

                    <div class="col-span-5 bg-white p-3 rounded-lg border border-stone-200 shadow-sm flex flex-col justify-between">
                        <div>
                            <h3 class="text-xs font-bold text-stone-700 mb-2 pb-1 border-b flex justify-between items-center">
                                <span>📊 دفتر الحسابات اليومي للوارد والصادر</span>
                                <span class="text-[10px] text-stone-400 font-normal">بيان الميزانية</span>
                            </h3>
                            
                            <div class="relative w-full h-80 border border-stone-200 rounded overflow-hidden">
                                <div class="handwriting-lines absolute inset-0 opacity-60" style="background-size: 100% 24px; line-height: 24px;"></div>
                                <div class="absolute top-0 bottom-0 right-[60%] border-l border-red-200 opacity-70"></div>
                                <div class="absolute top-0 bottom-0 right-[80%] border-l border-green-200 opacity-70"></div>
                                <div class="absolute top-0 right-0 left-0 h-6 bg-stone-50 border-b border-stone-200 flex text-[10px] font-bold text-stone-500 text-center items-center">
                                    <div class="w-[60%]">البيان الوصفي</div>
                                    <div class="w-[20%] border-r">وارد (+)</div>
                                    <div class="w-[20%] border-r">صادر (-)</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-2 border-t border-stone-100 pt-2">
                            <span class="text-[9px] font-bold text-stone-400 block mb-1">📝 ملاحظات مالية أو فواتير ملحقة باليوم:</span>
                            <div class="h-10 w-full border border-dashed border-stone-200 rounded bg-stone-50/50"></div>
                        </div>
                    </div>
                </div>

                <footer class="mt-2 bg-white border border-stone-200 rounded-lg p-1.5 shadow-inner">
                    <div id="footer-calendar-container" class="flex flex-row items-center justify-between text-[10px]"></div>
                </footer>
            </div>

        </main>
    </div>

    <script>
        let currentDateStr = "2026-07-01";
        const monthsNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

        window.onload = function() {
            buildYearlyGrid();
            loadDate(currentDateStr);
        };

        function switchView(viewId) {
            document.querySelectorAll('.view-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
        }

        function goToDate(dateStr) {
            currentDateStr = dateStr;
            loadDate(dateStr);
            switchView('daily');
        }

        function goToMonth(year, monthIdx) {
            const dateStr = `${year}-${String(monthIdx+1).padStart(2, '0')}-01`;
            goToDate(dateStr);
        }

        function buildYearlyGrid() {
            const grid = document.getElementById('yearly-grid');
            grid.innerHTML = '';
            
            const schedule = [
                {y: 2026, m: 6}, {y: 2026, m: 7}, {y: 2026, m: 8}, {y: 2026, m: 9}, {y: 2026, m: 10}, {y: 2026, m: 11},
                {y: 2027, m: 0}, {y: 2027, m: 1}, {y: 2027, m: 2}, {y: 2027, m: 3}, {y: 2027, m: 4}, {y: 2027, m: 5}, {y: 2027, m: 6}
            ];

            schedule.forEach(item => {
                let monthBox = document.createElement('div');
                monthBox.className = "bg-white p-1.5 rounded border border-stone-200 text-center shadow-xs";
                monthBox.innerHTML = `<h3 class="text-[11px] font-bold text-stone-700 border-b pb-0.5 mb-1 bg-stone-50">${monthsNames[item.m]} ${item.y}</h3>`;
                
                let daysGrid = document.createElement('div');
                daysGrid.className = "grid grid-cols-7 gap-0.5 text-[9px] font-medium";
                
                let totalDays = new Date(item.y, item.m + 1, 0).getDate();
                for (let d = 1; d <= totalDays; d++) {
                    let dStr = `${item.y}-${String(item.m+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    daysGrid.innerHTML += `<span onclick="goToDate('${dStr}')" class="cursor-pointer hover:bg-amber-100 rounded text-stone-600 py-0.5">${d}</span>`;
                }
                monthBox.appendChild(daysGrid);
                grid.appendChild(monthBox);
            });
        }

        function loadDate(dateStr) {
            const dateObj = new Date(dateStr);
            const dayName = dateObj.toLocaleDateString('ar-EG', { weekday: 'long' });
            
            // تحديث ورقة النتيجة الكلاسيكية بالبيانات الجديدة ديناميكياً
            document.getElementById('calendar-top-month').innerText = `${monthsNames[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
            document.getElementById('calendar-main-day').innerText = dateObj.getDate();
            document.getElementById('calendar-day-name').innerText = dayName;
            
            document.querySelectorAll('.month-tab').forEach(b => b.classList.remove('bg-stone-800', 'text-[#d4af37]', 'font-bold'));
            const activeTab = document.querySelector(`.month-tab[data-m="${dateObj.getFullYear()}-${dateObj.getMonth()}"]`);
            if (activeTab) activeTab.classList.add('bg-stone-800', 'text-[#d4af37]', 'font-bold');

            buildFooterCalendar(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        }

        function buildFooterCalendar(year, month, activeDay) {
            const container = document.getElementById('footer-calendar-container');
            container.innerHTML = `<span class="font-bold text-[#1e2421] bg-stone-100 px-1.5 py-0.5 rounded">${monthsNames[month]} ${year}:</span>`;
            
            let daysDiv = document.createElement('div');
            daysDiv.className = "flex-1 flex justify-around px-1";
            
            let totalDays = new Date(year, month + 1, 0).getDate();
            for (let d = 1; d <= totalDays; d++) {
                let dStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                let isActive = (d === activeDay) ? 'bg-[#1e2421] text-[#d4af37] font-black px-1.5 rounded-sm' : 'hover:bg-stone-200 rounded px-0.5 text-stone-600';
                daysDiv.innerHTML += `<span onclick="goToDate('${dStr}')" class="cursor-pointer text-center font-medium ${isActive}">${d}</span>`;
            }
            container.appendChild(daysDiv);
        }
    </script>
</body>
</html>
