<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة التكبير - مطابقة المعاينة - My Family's Mihrab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; }
        body { font-family: 'Segoe UI', sans-serif; background: #fdfdfd; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; background: #f1f2f6; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; text-align: right; gap: 5px; }
        label { font-weight: bold; font-size: 13px; color: var(--primary); }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-download { background: #27ae60; } .btn-print { background: #2980b9; }
        .btn:hover { opacity: 0.8; transform: scale(1.02); }

        /* منطقة المعاينة المزدوجة */
        .preview-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; background: #fff; }
        h4 { margin-top: 0; color: var(--primary); }

        /* المعاينة 1: الصورة الأصلية مع الشبكة */
        .img-wrapper { position: relative; display: inline-block; border: 2px solid #333; line-height: 0; }
        #orig-img { max-width: 100%; height: auto; }
        .grid-overlay { position: absolute; top:0; left:0; width:100%; height:100%; display:grid; pointer-events:none; }
        .grid-cell { border: 1px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; color: yellow; font-weight: bold; text-shadow: 1px 1px 2px #000; font-size: 14px; }

        /* المعاينة 2: الأوراق الفعلية بمحتواها */
        #pages-view { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .page-tile { 
            border: 1px solid #000; 
            position: relative; 
            overflow: hidden; 
            background-repeat: no-repeat;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .page-num-label { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.6); color: white; padding: 2px 5px; border-radius: 3px; font-size: 10px; }
        .overlap-shade { position: absolute; background: rgba(189, 195, 199, 0.7); border: 1px dashed red; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة التكبير الاحترافية: مطابقة المعاينة بالصورة</h2>
    
    <div class="controls">
        <div class="input-group">
            <label>1. ارفع الصورة:</label>
            <input type="file" id="fileIn" accept="image/*" onchange="loadImage()">
        </div>
        <div class="input-group">
            <label>2. العرض (سم):</label>
            <input type="number" id="wCm" value="60" oninput="renderAll()">
        </div>
        <div class="input-group">
            <label>3. الارتفاع (سم):</label>
            <input type="number" id="hCm" value="80" oninput="renderAll()">
        </div>
        <div class="input-group">
            <label>4. الوضعية:</label>
            <select id="mode" onchange="renderAll()">
                <option value="p">A4 عمودي</option>
                <option value="l">A4 أفقي</option>
            </select>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-download" onclick="exportPDF(false)">حفظ PDF</button>
        <button class="btn btn-print" onclick="exportPDF(true)">طباعة</button>
    </div>

    <div class="preview-section">
        <div class="card">
            <h4>1. المخطط العام (الصورة الأصلية)</h4>
            <div class="img-wrapper">
                <img id="orig-img" src="">
                <div id="grid-layer" class="grid-overlay"></div>
            </div>
        </div>

        <div class="card">
            <h4>2. تفاصيل الأوراق (ما سيتم طباعته)</h4>
            <div id="pages-view"></div>
        </div>
    </div>
</div>

<script>
    const overlapMm = 15;
    let currentImgData = "";

    function loadImage() {
        const file = document.getElementById('fileIn').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            currentImgData = e.target.result;
            document.getElementById('orig-img').src = currentImgData;
            document.getElementById('orig-img').onload = renderAll;
        };
        reader.readAsDataURL(file);
    }

    function renderAll() {
        if (!currentImgData) return;
        
        const wTarget = parseFloat(document.getElementById('wCm').value) * 10;
        const hTarget = parseFloat(document.getElementById('hCm').value) * 10;
        const mode = document.getElementById('mode').value;
        const pW = mode === 'p' ? 210 : 297;
        const pH = mode === 'p' ? 297 : 210;
        const effW = pW - overlapMm;
        const effH = pH - overlapMm;

        const cols = Math.ceil(wTarget / effW);
        const rows = Math.ceil(hTarget / effH);

        // تحديث شبكة الصورة الأصلية
        const layer = document.getElementById('grid-layer');
        layer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        layer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        layer.innerHTML = '';
        for(let i=1; i<=(rows*cols); i++) {
            const d = document.createElement('div');
            d.className = 'grid-cell'; d.innerText = i;
            layer.appendChild(d);
        }

        // تحديث معاينة الأوراق (مع عرض أجزاء الصورة الحقيقية)
        const pagesView = document.getElementById('pages-view');
        pagesView.innerHTML = '';
        const scale = 0.3; // مقاس المعاينة

        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.style.display = 'flex'; rowDiv.style.gap = '5px'; rowDiv.style.marginBottom = '5px';
            for (let c = 0; c < cols; c++) {
                const tile = document.createElement('div');
                tile.className = 'page-tile';
                tile.style.width = pW * scale + 'px';
                tile.style.height = pH * scale + 'px';
                
                // عرض جزء الصورة داخل الورقة
                tile.style.backgroundImage = `url(${currentImgData})`;
                tile.style.backgroundSize = `${(wTarget/pW) * (pW * scale)}px ${(hTarget/pH) * (pH * scale)}px`;
                tile.style.backgroundPosition = `-${c * effW * scale}px -${r * effH * scale}px`;

                tile.innerHTML = `<div class="page-num-label">${r*cols+c+1}</div>`;

                // تظليل التراكب
                if (c < cols - 1) {
                    const s = document.createElement('div'); s.className = 'overlap-shade';
                    s.style.right = '0'; s.style.top = '0'; s.style.width = overlapMm * scale + 'px'; s.style.height = '100%';
                    tile.appendChild(s);
                }
                if (r < rows - 1) {
                    const s = document.createElement('div'); s.className = 'overlap-shade';
                    s.style.bottom = '0'; s.style.left = '0'; s.style.width = '100%'; s.style.height = overlapMm * scale + 'px';
                    tile.appendChild(s);
                }
                rowDiv.appendChild(tile);
            }
            pagesView.appendChild(rowDiv);
        }
    }

    async function exportPDF(isPrint) {
        const { jsPDF } = window.jspdf;
        const img = document.getElementById('orig-img');
        if (!img.src) return;

        const wTarget = parseFloat(document.getElementById('wCm').value) * 10;
        const hTarget = parseFloat(document.getElementById('hCm').value) * 10;
        const mode = document.getElementById('mode').value;

        const pdf = new jsPDF({ orientation: mode, unit: 'mm', format: 'a4' });
        const pW = pdf.internal.pageSize.getWidth();
        const pH = pdf.internal.pageSize.getHeight();
        const effW = pW - overlapMm;
        const effH = pH - overlapMm;
        const cols = Math.ceil(wTarget / effW);
        const rows = Math.ceil(hTarget / effH);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (r > 0 || c > 0) pdf.addPage();
                pdf.addImage(img, 'JPEG', -c * effW, -r * effH, wTarget, hTarget, undefined, 'SLOW');
                
                // التراكب والقص
                pdf.setFillColor(200, 200, 200);
                if (c < cols - 1) {
                    pdf.rect(pW - overlapMm, 0, overlapMm, pH, 'F');
                    pdf.setTextColor(255, 255, 255); pdf.text("PASTE HERE", pW - (overlapMm/2), pH/2, { angle: 90, align: 'center' });
                }
                if (r < rows - 1) {
                    pdf.rect(0, pH - overlapMm, pW, overlapMm, 'F');
                    pdf.setTextColor(255, 255, 255); pdf.text("PASTE HERE", pW/2, pH - (overlapMm/2), { align: 'center' });
                }
                pdf.setDrawColor(255, 0, 0); pdf.setLineDashPattern([2, 2], 0);
                if (c < cols - 1) pdf.line(pW - overlapMm, 0, pW - overlapMm, pH);
                if (r < rows - 1) pdf.line(0, pH - overlapMm, pW, pH - overlapMm);

                pdf.setLineDashPattern([], 0); pdf.setTextColor(0, 0, 0);
                pdf.text(`Page: ${r * cols + c + 1}`, 5, 10);
            }
        }
        if (isPrint) { pdf.autoPrint(); window.open(pdf.output('bloburl'), '_blank'); }
        else { pdf.save("Mihrab_Poster.pdf"); }
    }
</script>

</body>
</html>
