<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYH Premium Interactive Planner 2026-2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght=700;900&family=Tajawal:wght=400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #c5c1aa; color: #1e211f; user-select: none; }
        .brand-logo { font-family: 'Cinzel', serif; letter-spacing: 0.25em; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); }
        .ipad-container { width: 1024px; height: 768px; max-width: 1024px; max-height: 768px; background-color: #fbfaf4; }
        .handwriting-lines { background-image: linear-gradient(#e4e1cf 1px, transparent 1px); background-size: 100% 24px; line-height: 24px; }
        .card-lines { background-image: linear-gradient(#e6e3d2 1px, transparent 1px); background-size: 100% 20px; line-height: 20px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* تنسيق خاص لتجميع صفحات الـ PDF كاملاً وبشكل متتالي */
        .pdf-page { width: 1024px; height: 768px; page-break-after: always; position: relative; background-color: #fbfaf4; display: flex; flex-direction: row; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-2">

    <!-- الواجهة الحية التفاعلية -->
    <div class="ipad-container shadow-2xl rounded-xl overflow-hidden flex flex-row relative border border-stone-400" id="planner-root">
        <!-- شريط التنقل الجانبي -->
        <aside class="w-24 bg-[#0b1a16] text-stone-300 flex flex-col items-center py-4 justify-between z-10 border-l-2 border-[#122822]">
            <div class="w-full flex flex-col items-center gap-2">
                <div class="mb-2 text-center px-1 py-1.5 border border-[#dfb141]/30 bg-[#060f0d] rounded-md w-[85%] shadow-md">
                    <span class="brand-logo text-sm font-black text-[#dfb141] block pl-[0.25em]">MYH</span>
                    <span class="text-[7px] text-stone-400 font-bold uppercase tracking-[0.15em] block mt-0.5 border-t border-stone-800 pt-0.5">Studio</span>
                </div>

                <!-- زر تصدير الأجندة كاملة -->
                <button onclick="exportFullPlannerPDF()" id="export-btn" class="w-[85%] mb-2 py-2 text-[9px] font-black text-center rounded bg-[#dfb141] text-stone-950 border border-[#bfa23d] shadow-md hover:bg-[#f2c652] transition flex flex-col items-center justify-center gap-0.5">
                    <span id="btn-text-main">📥 تصدير الأجندة كاملة</span>
                    <span id="btn-text-sub" class="text-[7px] opacity-75">بكامل الروابط</span>
                </button>
                
                <div class="w-full px-1.5 flex flex-col gap-1 border-b border-stone-800 pb-3 mb-2">
                    <button onclick="setMode('work')" id="mode-btn-work" class="w-full py-2 text-[10px] font-black text-center rounded transition bg-[#16332b] text-[#dfb141] border border-[#235245]">🎨 العملي</button>
                    <button onclick="setMode('personal')" id="mode-btn-personal" class="w-full py-2 text-[10px] font-bold text-center rounded transition bg-stone-900 text-stone-400">🍏 الشخصي</button>
                </div>

                <button onclick="switchView('yearly')" class="w-full py-1 text-[11px] font-bold text-center hover:bg-[#16332b] text-stone-400">📅 السنوي</button>
                
                <div class="flex flex-col gap-0.5 w-full overflow-y-auto hide-scrollbar max-h-[350px]" id="months-list-aside"></div>
            </div>
            <button onclick="switchView('daily')" class="w-full py-2.5 text-[11px] font-bold text-center bg-[#060f0d] text-[#dfb141] rounded-b border-t border-stone-800">اليوم الحالي</button>
        </aside>

        <!-- مساحة العمل الرئيسية -->
        <main class="flex-1 flex flex-col justify-between overflow-hidden bg-[#faf9f2]">
            <div class="flex-1 flex flex-col p-4 justify-between overflow-hidden">
                
                <!-- الواجهة السنوية -->
                <div id="view-yearly" class="view-content flex-1 flex flex-col justify-center">
                    <h1 class="text-base font-bold text-center text-stone-800 mb-3 brand-logo tracking-wider">ANNUAL TIMELINE 2026 - 2027</h1>
                    <div class="grid grid-cols-4 gap-2 overflow-y-auto max-h-[580px] p-1" id="yearly-grid"></div>
                </div>

                <!-- الواجهة اليومية -->
                <div id="view-daily" class="view-content flex-1 hidden flex flex-col justify-between">
                    <div class="flex flex-row justify-between items-center border-b-2 border-stone-200 pb-2 mb-2">
                        <div class="flex items-center gap-4">
                            <div class="w-28 bg-white rounded border border-stone-300 overflow-hidden text-center shadow-md">
                                <div class="bg-[#b3432b] text-white py-0.5 text-[10px] font-bold" id="calendar-top-month">يوليو ٢٠٢٦</div>
                                <div class="py-1 bg-stone-50">
                                    <div class="text-2xl font-black text-stone-900" id="calendar-main-day">1</div>
                                    <div class="text-[10px] font-bold text-stone-500" id="calendar-day-name">الأربعاء</div>
                                </div>
                            </div>
                            <span id="current-mode-badge" class="text-[10px] bg-[#16332b] text-[#dfb141] font-bold px-2.5 py-0.5 rounded border border-[#235245]">القسم العملي والأكاديمي</span>
                        </div>
                        <div class="text-right border-r-2 border-[#dfb141] pr-2">
                            <span class="brand-logo text-base font-black text-stone-900 block">MYH</span>
                            <span class="text-[8px] text-stone-400 font-bold block -mt-1">PREMIUM</span>
                        </div>
                    </div>

                    <!-- محتويات الأطوار -->
                    <div id="sub-view-work" class="daily-sub-view flex-1 flex flex-col justify-between">
                        <div class="bg-white p-2 rounded-lg border border-stone-200 h-9 mb-2 grid grid-cols-8 gap-1">
                            <!-- الحصص الدراسية الـ 8 -->
                            <div class="text-center text-[10px] border-r border-stone-100">١</div><div class="text-center text-[10px] border-r border-stone-100">٢</div><div class="text-center text-[10px] border-r border-stone-100">٣</div><div class="text-center text-[10px] border-r border-stone-100">٤</div><div class="text-center text-[10px] border-r border-stone-100">٥</div><div class="text-center text-[10px] border-r border-stone-100">٦</div><div class="text-center text-[10px] border-r border-stone-100">٧</div><div class="text-center text-[10px]">٨</div>
                        </div>
                        <div class="bg-white p-2 rounded-lg border border-stone-200 flex-1 grid grid-cols-3 gap-2" id="art-cards-container"></div>
                    </div>

                    <div id="sub-view-personal" class="daily-sub-view flex-1 hidden grid grid-cols-12 gap-4">
                        <div class="col-span-4 bg-white p-3 rounded-lg border border-stone-200 flex flex-col"><h3 class="text-xs font-bold border-b pb-1">🍏 المسؤوليات العائلية</h3><div class="handwriting-lines flex-1 mt-2"></div></div>
                        <div class="col-span-8 bg-white p-3 rounded-lg border border-stone-200 flex flex-col"><h3 class="text-xs font-bold border-b pb-1">📝 تدوينات شخصية ومالية</h3><div class="handwriting-lines flex-1 mt-2"></div></div>
                    </div>
                </div>
            </div>

            <!-- شريط الأيام الممتد بالكامل -->
            <footer class="w-full bg-[#e8e6da] border-t border-stone-300 px-2 py-2 flex items-center z-10">
                <div id="footer-calendar-container" class="w-full flex flex-row items-center justify-between text-[11px] font-bold"></div>
            </footer>
        </main>
    </div>

    <!-- مسرح التجميع الخلفي السري (مخفي تماماً) لإنشاء الأجندة كاملة بدون تهنيج -->
    <div id="compiler-stage" class="hidden"></div>

    <script>
        let currentDateStr = "2026-07-01";
        let currentMode = "work";
        const monthsNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const schedule = [
            {y: 2026, m: 6}, {y: 2026, m: 7}, {y: 2026, m: 8}, {y: 2026, m: 9}, {y: 2026, m: 10}, {y: 2026, m: 11},
            {y: 2027, m: 0}, {y: 2027, m: 1}, {y: 2027, m: 2}, {y: 2027, m: 3}, {y: 2027, m: 4}, {y: 2027, m: 5}, {y: 2027, m: 6}
        ];

        window.onload = function() {
            buildYearlyGrid();
            buildMonthsList();
            loadDate(currentDateStr);
        };

        function setMode(mode) { currentMode = mode; updateViews(); }
        function switchView(v) { document.querySelectorAll('.view-content').forEach(e => e.classList.add('hidden')); document.getElementById(`view-${v}`).classList.remove('hidden'); }
        function goToDate(d) { currentDateStr = d; loadDate(d); switchView('daily'); }
        function goToMonth(y, m) { goToDate(`${y}-${String(m+1).padStart(2, '0')}-01`); }

        function buildMonthsList() {
            const container = document.getElementById('months-list-aside');
            container.innerHTML = '';
            schedule.forEach(item => {
                container.innerHTML += `<button onclick="goToMonth(${item.y}, ${item.m})" class="w-full py-1.5 text-[11px] text-center hover:bg-[#16332b]">${monthsNames[item.m]}</button>`;
            });
        }

        function loadDate(dateStr) {
            const dObj = new Date(dateStr);
            document.getElementById('calendar-top-month').innerText = `${monthsNames[dObj.getMonth()]} ${dObj.getFullYear()}`;
            document.getElementById('calendar-main-day').innerText = dObj.getDate();
            
            const cards = document.getElementById('art-cards-container');
            cards.innerHTML = '';
            for(let i=1; i<=3; i++) cards.innerHTML += `<div class="border p-2 rounded bg-stone-50"><span class="text-[9px] text-stone-400 block border-b pb-1 mb-1">تحضير الدرس ${i}</span><div class="card-lines h-32 opacity-50"></div></div>`;
            
            updateViews();
            buildFooterCalendar(dObj.getFullYear(), dObj.getMonth(), dObj.getDate());
        }

        function updateViews() {
            document.querySelectorAll('.daily-sub-view').forEach(e => e.classList.add('hidden'));
            document.getElementById(currentMode === 'work' ? 'sub-view-work' : 'sub-view-personal').classList.remove('hidden');
        }

        function buildFooterCalendar(year, month, activeDay) {
            const container = document.getElementById('footer-calendar-container');
            container.innerHTML = `<span class="bg-stone-300/60 px-2 py-1 rounded text-[10px]">${monthsNames[month]} :</span>`;
            let wrapper = document.createElement('div');
            wrapper.className = "flex-1 flex justify-between items-center gap-0.5 pr-2";
            let total = new Date(year, month + 1, 0).getDate();
            for(let d=1; d<=total; d++) {
                let dStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                wrapper.innerHTML += `<span onclick="goToDate('${dStr}')" class="flex-1 text-center py-1 rounded cursor-pointer ${d===activeDay?'bg-[#0b1a16] text-[#dfb141] font-black scale-110':''}" style="font-size:10px;">${d}</span>`;
            }
            container.appendChild(wrapper);
        }

        function buildYearlyGrid() {
            const grid = document.getElementById('yearly-grid');
            grid.innerHTML = '';
            schedule.forEach(item => {
                let box = document.createElement('div');
                box.className = "bg-white p-1 rounded border text-center text-[9px]";
                box.innerHTML = `<h3 class="font-bold border-b mb-1">${monthsNames[item.m]} ${item.y}</h3>`;
                let dGrid = document.createElement('div');
                dGrid.className = "grid grid-cols-7 gap-0.5";
                let total = new Date(item.y, item.m + 1, 0).getDate();
                for(let d=1; d<=total; d++) {
                    let dStr = `${item.y}-${String(item.m+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    dGrid.innerHTML += `<span onclick="goToDate('${dStr}')" class="cursor-pointer hover:bg-stone-200">${d}</span>`;
                }
                box.appendChild(dGrid);
                grid.appendChild(box);
            });
        }

        /* 🚀 محرك التجميع والإنتاج الشامل لكافة صفحات الأجندة التفاعلية بضغطة واحدة */
        async function exportFullPlannerPDF() {
            const btn = document.getElementById('export-btn');
            btn.innerText = "⏳ جاري تجميع الأجندة كاملاً...";
            
            const stage = document.getElementById('compiler-stage');
            stage.innerHTML = ''; // تنظيف المسرح الخلفي
            
            // 1. إضافة الواجهة السنوية كصفحة أولى مستقلة
            let yearlyClone = document.getElementById('view-yearly').cloneNode(true);
            yearlyClone.classList.remove('hidden');
            let firstPage = document.createElement('div');
            firstPage.className = "pdf-page p-6 flex flex-col justify-center items-center";
            firstPage.appendChild(yearlyClone);
            stage.appendChild(firstPage);

            // 2. تجميع كل يوم من أيام الـ 13 شهراً كصفحة منفصلة تلقائياً بكافة أسطرها وروابطها
            for (let item of schedule) {
                let totalDays = new Date(item.y, item.m + 1, 0).getDate();
                for (let d = 1; d <= totalDays; d++) {
                    let pageWrapper = document.createElement('div');
                    pageWrapper.className = "pdf-page";
                    
                    // استنساخ الهيكل التفاعلي لليوم الحالي
                    let dailyClone = document.getElementById('planner-root').cloneNode(true);
                    dailyClone.querySelector('#export-btn').remove(); // إزالة أزرار التحكم
                    
                    // تحديث بيانات اليوم بداخل النسخة الخلفية لتثبيتها في الـ PDF
                    dailyClone.querySelector('#calendar-top-month').innerText = `${monthsNames[item.m]} ${item.y}`;
                    dailyClone.querySelector('#calendar-main-day').innerText = d;
                    
                    pageWrapper.appendChild(dailyClone);
                    stage.appendChild(pageWrapper);
                }
            }

            // إعدادات التصدير بجودة مطبعية فائقة بدون فقدان الروابط
            const opt = {
                margin:       0,
                filename:     'MYH_Complete_Interactive_Planner_2026-2027.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 1.5, useCORS: true, logging: false },
                jsPDF:        { unit: 'px', format: [1024, 768], orientation: 'landscape' }
            };

            try {
                // توليد وتصدير الكتاب الرقمي المجمع فوراً
                await html2pdf().set(opt).from(stage).save();
            } catch (err) {
                alert("يرجى استخدام متصفح Safari لضمان تصدير الملف بالكامل.");
            } finally {
                btn.innerHTML = `<span>📥 تصدير الأجندة كاملة</span><span class="text-[7px] opacity-75">بكامل الروابط</span>`;
                stage.innerHTML = ''; // تفريغ الذاكرة فوراً لحماية أداء الجهاز
            }
        }
    </script>
</body>
</html>
