<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{
    --card: 48px;             /* حجم البطاقات — يمكن تصغيره */
    --gap: 4px;
    --ruby: #8b002b;
    --ruby-ink: #ffffff;
    --cream: #faeedb;
    --cream-ink: #8b002b;
  }

  body{
    background:#f7f3f1;
    padding:20px;
    font-family:"Cairo",sans-serif;
  }

  .wrap{
    background:white;
    padding:10px;
    border-radius:10px;
    width:fit-content;
    margin:auto;
    border:1px solid #dbcac2;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(10, var(--card));
    grid-template-rows:repeat(3, var(--card));
    gap:var(--gap);
  }

  .card{
    width:var(--card);
    height:var(--card);
    border-radius:6px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-sizing:border-box;
    border:1px solid rgba(0,0,0,0.15);
    overflow:visible;
  }

  /* صف الحصص */
  .ruby-card{
    background:var(--ruby);
    color:var(--ruby-ink);
    border-color:#6a001f;
  }

  /* بطاقات الطابور والفسحة */
  .solid{
    background:var(--ruby);
  }

  /* صف الأوقات */
  .cream-card{
    background:var(--cream);
    color:var(--cream-ink);
    border-color:#e5d6c7;
  }

  /* نص رأسي بالكامل */
  .v{
    writing-mode:vertical-rl;
    text-orientation:upright;
    font-weight:900;
    line-height:1;
  }

  .num{
    font-size:18px;
  }

  .time{
    font-size:13px;
  }
</style>
</head>

<body>

<div class="wrap">
  <div class="grid">

    <!-- الصف 1: بطاقات الحصص (أفقي + لون ياقوتي) -->
    <div class="card solid"></div>
    <div class="card ruby-card"><div class="v num">1</div></div>
    <div class="card ruby-card"><div class="v num">2</div></div>
    <div class="card ruby-card"><div class="v num">3</div></div>
    <div class="card ruby-card"><div class="v num">4</div></div>

    <div class="card ruby-card"><div class="v num">5</div></div>

  </div>
</div>

</body>
</html>
