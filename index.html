<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>

    body {
      margin: 0;
      padding: 20px;
      background: #f7f4f2; /* خلفية ناعمة */
      font-family: "Cairo", sans-serif;
    }

    /* الشريط الرئيسي */
    .header-bar {
      width: 1200px;
      padding: 8px;
      background: #ffffff;
      border: 1px solid #e2d8d0;
      border-radius: 10px;
      display: flex;
      gap: 8px;
      box-sizing: border-box;
    }

    /* البطاقات */
    .item {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 900;        /* Bold قوي وواضح */
      font-size: 18px;         /* الرقم كبير */
      line-height: 1.1;
      color: #3a1a1a;          /* بني غامق ناعم */
    }

    /* ألوان فاخرة جديدة */
    .ruby {
      background: #a4003a;   /* Ruby Dark */
      color: #ffffff;
    }

    .beige {
      background: #f5e9da;   /* Sand Beige راقٍ */
      color: #3b1b1b;
    }

    /* وقت الحصة */
    .time {
      margin-top: 4px;
      font-size: 12px;        /* أكبر من قبل */
      font-weight: 800;       /* Bold وواضح */
      opacity: 1;             /* بدون تخفيف */
    }

  </style>
</head>

<body>

  <div class="header-bar">

    <div class="item ruby">
      ط
      <div class="time">7:30–7:40</div>
    </div>

    <div class="item beige">1<div class="time">7:40–8:15</div></div>
    <div class="item beige">2<div class="time">8:15–8:50</div></div>
    <div class="item beige">3<div class="time">8:50–9:25</div></div>
    <div class="item beige">4<div class="time">9:25–10:00</div></div>

    <div class="item ruby">
      ف
      <div class="time">10:00–10:10</div>
    </div>

    <div class="item beige">5<div class="time">10:10–10:45</div></div>
    <div class="item beige">6<div class="time">10:45–11:20</div></div>
    <div class="item beige">7<div class="time">11:20–11:55</div></div>
    <div class="item beige">8<div class="time">11:55–12:30</div></div>

  </div>

</body>
</html>
