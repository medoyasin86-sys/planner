<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        @page { size: 1024px 768px landscape; margin: 0; }
        body { margin: 0; background: #bcbab0; padding: 20px; }
        .page { width: 1024px; height: 768px; background: white; margin-bottom: 20px; display: flex; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        @media print { body { padding: 0; } .page { margin: 0; box-shadow: none; page-break-after: always; } }
    </style>
</head>
<body>
    <div style="padding: 20px; background: white; border-radius: 10px; margin-bottom: 20px;">
        <h2 style="margin: 0;">أداة توليد الشهر (النسخة المستقرة)</h2>
        <p>اختر الشهر والسن واضغط توليد:</p>
        <input type="number" id="year" value="2026" placeholder="السنة">
        <input type="number" id="month" value="6" placeholder="الشهر (1-12)">
        <button onclick="generateMonth()" style="padding: 10px 20px; background: green; color: white; border: none; cursor: pointer;">توليد هذا الشهر</button>
    </div>
    <div id="canvas"></div>

    <script>
        function generateMonth() {
            const y = document.getElementById('year').value;
            const m = document.getElementById('month').value - 1;
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            
            const days = new Date(y, m + 1, 0).getDate();
            for(let d=1; d<=days; d++) {
                const div = document.createElement('div');
                div.className = 'page';
                div.innerHTML = `<div style="padding: 40px; width: 100%;">
                    <h1>التاريخ: ${d}/${m+1}/${y}</h1>
                    <div style="border: 2px solid #ccc; height: 500px; margin-top: 20px;"></div>
                </div>`;
                canvas.appendChild(div);
            }
            alert("تم التوليد! الآن اضغط (مشاركة -> طباعة -> حفظ كـ PDF)");
        }
    </script>
</body>
</html>
