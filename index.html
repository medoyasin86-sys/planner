<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحديد حجم البوستر - 1.5cm Overlap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin: auto;
        }
        h2 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
            text-align: right;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; font-size: 14px; }
        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .info-box {
            background: #e1f5fe;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
            color: #0277bd;
            text-align: right;
        }
        .btn-generate {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-generate:hover { background: #34495e; }
    </style>
</head>
<body>

<div class="container">
    <h2>إعدادات حجم البوستر النهائي</h2>
    
    <div class="settings-grid">
        <div class="control-group">
            <label>تحميل الصورة:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="control-group">
            <label>العرض المطلوب للبوستر (سم):</label>
            <input type="number" id="targetWidthCm" value="100" min="10">
        </div>
        <div class="control-group">
            <label>الارتفاع المطلوب للبوستر (سم):</label>
            <input type="number" id="targetHeightCm" value="150" min="10">
        </div>
        <div class="control-group">
            <label>اتجاه ورقة الطباعة:</label>
            <select id="orientation">
                <option value="p">عمودي (Portrait - A4)</option>
                <option value="l">أفقي (Landscape - A4)</option>
            </select>
        </div>
    </div>

    <div class="info-box">
        * ملاحظة: سيقوم البرنامج تلقائياً بحساب عدد أوراق A4 المطلوبة لتغطية المقاس الذي اخترته مع الحفاظ على مسافة تراكب 1.5 سم للإلصاق.
    </div>

    <button class="btn-generate" onclick="calculateAndGenerate()">توليد ملف PDF بالمقاس المحدد</button>
    <div id="status" style="margin-top:15px; font-weight:bold;"></div>
</div>

<script>
    async function calculateAndGenerate() {
        const { jsPDF } = window.jspdf;
        const fileInput = document.getElementById('imageInput');
        const targetWidthMm = parseFloat(document.getElementById('targetWidthCm').value) * 10;
        const targetHeightMm = parseFloat(document.getElementById('targetHeightCm').value) * 10;
        const orientation = document.getElementById('orientation').value;
        const status = document.getElementById('status');

        if (!fileInput.files[0]) {
            alert("يرجى اختيار صورة أولاً");
            return;
        }

        status.innerText = "جاري حساب الأوراق وتجهيز الملف...";

        const img = new Image();
        const reader = new FileReader();

        reader.onload = function(e) {
            img.src = e.target.result;
            img.onload = function() {
                const pdf = new jsPDF({
                    orientation: orientation,
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const overlap = 15; // 1.5 سم

                // المساحة الفعلية المتاحة من الصورة في كل ورقة بعد خصم التراكب
                const effectiveWidth = pageWidth - overlap;
                const effectiveHeight = pageHeight - overlap;

                // حساب عدد الصفوف والأعمدة المطلوبة
                const cols = Math.ceil(targetWidthMm / effectiveWidth);
                const rows = Math.ceil(targetHeightMm / effectiveHeight);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (r > 0 || c > 0) pdf.addPage();

                        // حساب مكان الرسم لتبدو الصورة مجمعة
                        // نقوم برسم الصورة كاملة بمقاسها المستهدف (Target) مع إزاحتها خارج حدود الصفحة
                        const xPos = -c * effectiveWidth;
                        const yPos = -r * effectiveHeight;

                        pdf.addImage(img, 'JPEG', xPos, yPos, targetWidthMm, targetHeightMm, undefined, 'SLOW');

                        // --- مساحة التراكب الرصاصية ---
                        pdf.setFillColor(180, 180, 180);
                        
                        // تراكب يمين (لأنه اتجاه عربي، التراكب عادة يكون من جهة الإلصاق)
                        if (c > 0) {
                            pdf.rect(0, 0, overlap, pageHeight, 'F');
                            pdf.setTextColor(255, 255, 255);
                            pdf.setFontSize(8);
                            pdf.text("PASTE HERE", overlap/2, pageHeight/2, {angle: 90, align: 'center'});
                        }

                        if (r > 0) {
                            pdf.rect(0, 0, pageWidth, overlap, 'F');
                            pdf.setTextColor(255, 255, 255);
                            pdf.setFontSize(8);
                            pdf.text("PASTE HERE", pageWidth/2, overlap/2 + 2, {align: 'center'});
                        }

                        // --- خطوط القص الحمراء ---
                        pdf.setDrawColor(255, 0, 0);
                        pdf.setLineDashPattern([2, 2], 0);
                        if (c < cols - 1) pdf.line(pageWidth - overlap, 0, pageWidth - overlap, pageHeight);
                        if (r < rows - 1) pdf.line(0, pageHeight - overlap, pageWidth, pageHeight - overlap);

                        // --- الترقيم ---
                        pdf.setLineDashPattern([], 0);
                        pdf.setTextColor(50, 50, 50);
                        pdf.setFontSize(10);
                        pdf.text(`لوحة: ${r*cols+c+1} | صف: ${r+1} عمود: ${c+1} | المقاس الكلي: ${targetWidthMm/10}x${targetHeightMm/10}سم`, 5, pageHeight - 5);
                    }
                }

                pdf.save(`Poster_${targetWidthMm/10}x${targetHeightMm/10}cm.pdf`);
                status.innerText = `تم الإنشاء! عدد الأوراق المستخدمة: ${rows * cols}`;
            };
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
