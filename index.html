<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تكبير الصور الاحترافية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 900px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin: auto;
        }
        h1 { color: var(--primary); margin-bottom: 30px; }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            text-align: right;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 600; font-size: 14px; }
        input, select {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
        }
        .btn-generate {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-generate:hover { background: #1d4ed8; transform: translateY(-2px); }
        #status { margin-top: 15px; font-weight: bold; color: var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <h1>أداة تكبير الصور للطباعة العملاقة</h1>
    
    <div class="settings-grid">
        <div class="control-group">
            <label>1. اختر الصورة المراد تكبيرها:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="control-group">
            <label>2. اتجاه الورقة (A4):</label>
            <select id="orientation">
                <option value="p">عمودي (Portrait)</option>
                <option value="l">أفقي (Landscape)</option>
            </select>
        </div>
        <div class="control-group">
            <label>3. عدد الصفوف (طولياً):</label>
            <input type="number" id="rows" value="2" min="1">
        </div>
        <div class="control-group">
            <label>4. عدد الأعمدة (عرضياً):</label>
            <input type="number" id="cols" value="2" min="1">
        </div>
    </div>

    <button class="btn-generate" onclick="processImage()">توليد ملف PDF عالي الجودة</button>
    <div id="status"></div>
</div>

<script>
    async function processImage() {
        const { jsPDF } = window.jspdf;
        const fileInput = document.getElementById('imageInput');
        const orientation = document.getElementById('orientation').value;
        const rows = parseInt(document.getElementById('rows').value);
        const cols = parseInt(document.getElementById('cols').value);
        const status = document.getElementById('status');

        if (!fileInput.files[0]) {
            alert("يرجى رفع صورة أولاً");
            return;
        }

        status.innerText = "جاري المعالجة... يرجى الانتظار";
        
        const img = new Image();
        const reader = new FileReader();

        reader.onload = function(e) {
            img.src = e.target.result;
            img.onload = function() {
                const pdf = new jsPDF({
                    orientation: orientation,
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const overlap = 15; // مساحة التراكب ملم

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (r > 0 || c > 0) pdf.addPage();

                        // حساب الأبعاد لضمان أعلى جودة
                        // يتم رسم الصورة كاملة مع إزاحة (Shift) لكل صفحة
                        const drawWidth = pageWidth * cols;
                        const drawHeight = pageHeight * rows;
                        const xPos = -c * (pageWidth - overlap);
                        const yPos = -r * (pageHeight - overlap);

                        pdf.addImage(img, 'JPEG', xPos, yPos, drawWidth, drawHeight, undefined, 'FAST');

                        // --- إضافة منطقة التراكب (Overlap) باللون الرصاصي ---
                        pdf.setFillColor(128, 128, 128); // رصاصي
                        
                        // تراكب الجهة اليسرى (للإلصاق)
                        if (c > 0) {
                            pdf.rect(0, 0, overlap, pageHeight, 'F');
                            pdf.setTextColor(255, 255, 255);
                            pdf.setFontSize(10);
                            pdf.text("PASTE HERE", overlap / 2, pageHeight / 2, { angle: 90, align: 'center' });
                        }

                        // --- خطوط القص الحمراء المقطعة ---
                        pdf.setDrawColor(255, 0, 0);
                        pdf.setLineDashPattern([2, 2], 0);
                        if (c < cols - 1) pdf.line(pageWidth - overlap, 0, pageWidth - overlap, pageHeight);
                        if (r < rows - 1) pdf.line(0, pageHeight - overlap, pageWidth, pageHeight - overlap);

                        // --- الترقيم والمعلومات ---
                        pdf.setLineDashPattern([], 0);
                        pdf.setTextColor(0, 0, 0);
                        pdf.setFontSize(12);
                        pdf.text(`صفحة: ${r * cols + c + 1} | صف: ${r + 1} - عمود: ${c + 1}`, 5, 10);
                    }
                }

                pdf.save("Poster_Enlarged.pdf");
                status.innerText = "تم التحميل بنجاح!";
            };
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
