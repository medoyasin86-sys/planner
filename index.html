<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>هيدر جدول — رأسي بالكامل بالألوان الياقوتية والكريمية</title>

  <style>
    :root{
      --banner-width: 1080px;
      --card-size: 56px;   /* مربّعات نحيفة وأنيقة */
      --gap: 6px;

      /* الألوان */
      --ruby: #8b002b;               /* ياقوتي داكن جميل */
      --ruby-ink: #ffffff;           /* نص أبيض داخل الياقوتي */
      --cream: #faeedb;              /* كريمي للأوقات */
      --cream-ink: #8b002b;          /* نص ياقوتي */
      --border: #d5c2b8;             /* حدود خفيفة أنيقة */
      --frame-bg: #ffffff;
      --page-bg: #f9f7f5;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page-bg);
      font-family: "Cairo", "Noto Kufi Arabic", sans-serif;
    }

    .header-bar{
      width: min(95vw, var(--banner-width));
      margin: 16px auto;
      padding: 10px;
      background: var(--frame-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      gap: var(--gap);
      box-sizing: border-box;
    }

    /* البطاقة الأساسية */
    .item{
      width: var(--card-size);
      height: var(--card-size);
      border-radius: 6px;
      background: var(--ruby);
      border: 1px solid #5e001d;
      color: var(--ruby-ink);
      display: flex;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-rl;   /* الاتجاه العمودي بالكامل */
      text-orientation: upright;
      font-weight: 900;
      box-sizing: border-box;
      position: relative;
    }

    /* الحرف/الرقم */
    .mark{
      font-size: 18px;
      font-weight: 900;
    }

    /* وقت الحصة — عمودي وبألوان مختلفة */
    .time{
      margin-top: 6px;
      padding: 2px 4px;
      background: var(--cream);
      color: var(--cream-ink);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 900;
      writing-mode: vertical-rl;   /* الوقت أيضًا عمودي */
      text-orientation: upright;
    }

    .stack{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

  </style>
</head>

<body>

  <div class="header-bar">

    <div class="item">
      <div class="stack">
        <div class="mark">ط</div>
        <div class="time">7:30–7:40</div>
      </div>
    </div>

    <div class="item"><div class="stack"><div class="mark">1</div><div class="time">7:40–8:15</div></div></div>
    <div class="item"><div class="stack"><div class="mark">2</div><div class="time">8:15–8:50</div></div></div>
    <div class="item"><div class="stack"><div class="mark">3</div><div class="time">8:50–9:25</div></div></div>
    <div class="item"><div class="stack"><div class="mark">4</div><div class="time">9:25–10:00</div></div></div>

    <div class="item">
      <div class="stack">
        <div class="mark">ف</div>
        <div class="time">10:00–10:10</div>
      </div>
    </div>

    <div class="item"><div class="stack"><div class="mark">5</div><div class="time">10:10–10:45</div></div></div>
    <div class="item"><div class="stack"><div class="mark">6</div><div class="time">10:45–11:20</div></div></div>
    <div class="item"><div class="stack"><div class="mark">7</div><div class="time">11:20–11:55</div></div></div>
    <div class="item"><div class="stack"><div class="mark">8</div><div class="time">11:55–12:30</div></div></div>

  </div>

</body>
</html>
