<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة وطباعة البوسترات - My Family's Mihrab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 1000px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin: auto; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; background: #f1f2f6; padding: 20px; border-radius: 10px; }
        .input-group { display: flex; flex-direction: column; text-align: right; gap: 5px; }
        label { font-weight: bold; font-size: 13px; color: var(--primary); }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-preview { background: var(--primary); }
        .btn-download { background: var(--accent); }
        .btn-print { background: #3498db; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        
        /* تصميم المعاينة */
        #preview-area { 
            margin-top: 30px; 
            padding: 20px; 
            border: 2px dashed #ccc; 
            background: #fafafa; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
            min-height: 200px;
        }
        .page-preview {
            background: white;
            border: 1px solid #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #999;
        }
        .overlap-zone { position: absolute; background: rgba(189, 195, 199, 0.8); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .cut-line { position: absolute; border: 1px dashed red; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة تصميم ومعاينة البوسترات (A4)</h2>
    
    <div class="controls">
        <div class="input-group">
            <label>ارفع الصورة:</label>
            <input type="file" id="imgInput" accept="image/*" onchange="updatePreview()">
        </div>
        <div class="input-group">
            <label>العرض المطلوب (سم):</label>
            <input type="number" id="wCm" value="60" oninput="updatePreview()">
        </div>
        <div class="input-group">
            <label>الارتفاع المطلوب (سم):</label>
            <input type="number" id="hCm" value="80" oninput="updatePreview()">
        </div>
        <div class="input-group">
            <label>الاتجاه:</label>
            <select id="orient" onchange="updatePreview()">
                <option value="p">عمودي</option>
                <option value="l">أفقي</option>
            </select>
        </div>
    </div>

    <div class="button-group">
        <button class="btn btn-preview" onclick="updatePreview()">تحديث المعاينة</button>
        <button class="btn btn-download" onclick="generatePDF(false)">تحميل PDF</button>
        <button class="btn btn-print" onclick="generatePDF(true)">طباعة فورية</button>
    </div>

    <div id="status" style="margin-top:10px; font-size:14px; color: var(--accent);"></div>

    <h3 style="text-align: right; margin-top: 30px;">معاينة تقسيم الورق:</h3>
    <div id="preview-area">
        <p>قم برفع صورة لرؤية مخطط التقسيم هنا...</p>
    </div>
</div>

<script>
    const overlapMm = 15; // 1.5 سم

    function updatePreview() {
        const previewArea = document.getElementById('preview-area');
        const orient = document.getElementById('orient').value;
        const targetW = parseFloat(document.getElementById('wCm').value) * 10;
        const targetH = parseFloat(document.getElementById('hCm').value) * 10;
        
        // أبعاد A4 بالملم
        const pW = orient === 'p' ? 210 : 297;
        const pH = orient === 'p' ? 297 : 210;
        
        const effW = pW - overlapMm;
        const effH = pH - overlapMm;
        
        const cols = Math.ceil(targetW / effW);
        const rows = Math.ceil(targetH / effH);

        previewArea.innerHTML = '';
        const scale = 0.5; // مقاس المعاينة (نصف الحجم الحقيقي للعرض فقط)

        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.style.display = 'flex';
            rowDiv.style.gap = '5px';
            rowDiv.style.marginBottom = '5px';
            
            for (let c = 0; c < cols; c++) {
                const page = document.createElement('div');
                page.className = 'page-preview';
                page.style.width = pW * scale + 'px';
                page.style.height = pH * scale + 'px';
                page.innerHTML = `ورقة ${r * cols + c + 1}<br>(${r+1},${c+1})`;

                // إضافة مناطق التراكب في المعاينة
                if (c < cols - 1) {
                    const ov = document.createElement('div');
                    ov.className = 'overlap-zone';
                    ov.style.right = '0'; ov.style.top = '0'; ov.style.width = overlapMm * scale + 'px'; ov.style.height = '100%';
                    ov.style.fontSize = '8px'; ov.innerText = 'لاصق';
                    page.appendChild(ov);
                }
                if (r < rows - 1) {
                    const ov = document.createElement('div');
                    ov.className = 'overlap-zone';
                    ov.style.bottom = '0'; ov.style.left = '0'; ov.style.width = '100%'; ov.style.height = overlapMm * scale + 'px';
                    ov.style.fontSize = '8px'; ov.innerText = 'لاصق';
                    page.appendChild(ov);
                }
                rowDiv.appendChild(page);
            }
            previewArea.appendChild(rowDiv);
        }
        document.getElementById('status').innerText = `إجمالي الورق المطلوب: ${rows * cols} ورقة A4`;
    }

    async function generatePDF(isPrint) {
        const { jsPDF } = window.jspdf;
        const input = document.getElementById('imgInput');
        if (!input.files[0]) { alert("ارفع صورة أولاً"); return; }

        const targetW = parseFloat(document.getElementById('wCm').value) * 10;
        const targetH = parseFloat(document.getElementById('hCm').value) * 10;
        const orient = document.getElementById('orient').value;

        const img = new Image();
        img.src = URL.createObjectURL(input.files[0]);

        img.onload = function() {
            const pdf = new jsPDF({ orientation: orient, unit: 'mm', format: 'a4' });
            const pW = pdf.internal.pageSize.getWidth();
            const pH = pdf.internal.pageSize.getHeight();
            const effW = pW - overlapMm;
            const effH = pH - overlapMm;
            const cols = Math.ceil(targetW / effW);
            const rows = Math.ceil(targetH / effH);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (r > 0 || c > 0) pdf.addPage();
                    
                    const xOff = -c * effW;
                    const yOff = -r * effH;
                    pdf.addImage(img, 'JPEG', xOff, yOff, targetW, targetH, undefined, 'SLOW');

                    // تراكب رصاصي
                    pdf.setFillColor(189, 195, 199);
                    if (c < cols - 1) {
                        pdf.rect(pW - overlapMm, 0, overlapMm, pH, 'F');
                        pdf.setTextColor(255, 255, 255);
                        pdf.text("PASTE HERE", pW - (overlapMm/2), pH/2, { angle: 90, align: 'center' });
                    }
                    if (r < rows - 1) {
                        pdf.rect(0, pH - overlapMm, pW, overlapMm, 'F');
                        pdf.setTextColor(255, 255, 255);
                        pdf.text("PASTE HERE", pW/2, pH - (overlapMm/2), { align: 'center' });
                    }

                    // خطوط قص حمراء
                    pdf.setDrawColor(231, 76, 60);
                    pdf.setLineDashPattern([2, 2], 0);
                    if (c < cols - 1) pdf.line(pW - overlapMm, 0, pW - overlapMm, pH);
                    if (r < rows - 1) pdf.line(0, pH - overlapMm, pW, pH - overlapMm);

                    // ترقيم
                    pdf.setLineDashPattern([], 0);
                    pdf.setTextColor(0, 0, 0);
                    pdf.text(`P: ${r * cols + c + 1} | Row: ${r+1}, Col: ${c+1}`, 5, 10);
                }
            }

            if (isPrint) {
                pdf.autoPrint();
                window.open(pdf.output('bloburl'), '_blank');
            } else {
                pdf.save(`Poster_${targetW/10}x${targetH/10}cm.pdf`);
            }
        };
    }
</script>

</body>
</html>
