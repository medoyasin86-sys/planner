<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>دفتر رمضان 1447هـ (2026) – Landscape PDF Generator</title>

<!-- الخطوط -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet" />

<!-- jsPDF + html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root{
  /* لوحة الألوان (من مشروعك) */
  --primary:#1a4d2e; --gold:#c5a059; --gold-light:#e6cc92; --bg:#f9f6f0;
  --card:#ffffff; --text:#1a4d2e; --accent:#d35400; --crimson:#900c3f;
  --muted:#6f7b7a; --border:#e6e2d9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 'Amiri', serif}
.wrap{max-width:1100px;margin:auto;padding:16px}
.header{
  background:linear-gradient(135deg,var(--primary),#0a2b1a); color:#fff;
  border:2px solid var(--gold); border-radius:14px; padding:14px; margin-bottom:12px
}
.header h1{margin:0 0 6px 0; font-family:'Reem Kufi'; color:var(--gold-light); font-size:22px}
.header .sub{background:rgba(255,255,255,.08); border:1px solid rgba(197,160,89,.35);
  padding:8px; border-radius:10px; font-size:.95rem}
.tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.btn{
  border:1px solid var(--gold); background:var(--gold); color:#1a1a1a;
  padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:700
}
.btn.ghost{background:#fff5d9}
.note{color:#6b6b6b; font-size:.9rem}

/* صفحات البلانر (نولدها داخل #planner) */
#planner{ display:none } /* مخفي حتى وقت التصدير (لأداء أفضل) */
.page{
  width: 1123px;  /* يقارب A4 landscape بنسبة 96dpi (297mm ≈ 1123px) */
  height: 794px;  /* 210mm ≈ 794px */
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  margin: 12px auto; padding: 10px; position: relative;
  color: var(--text);
}

/* رأس الصفحة */
.header-band{
  background: var(--primary); color:#fff; border: 2px solid var(--gold);
  border-radius: 12px; padding: 10px; margin-bottom: 8px;
}
.h-title{ margin:0; font-size:20px; font-family:'Reem Kufi'; color:var(--gold-light) }
.h-sub{ margin:4px 0 0 0; font-size:13px; color:var(--gold-light) }

/* عناصر */
.card{
  border: 1.5px solid var(--gold); border-radius: 12px; padding: 10px; background:#fff; margin-bottom: 8px;
}
.section-title{
  margin:0 0 8px 0; background:var(--primary); color:#fff; padding:6px 8px; border-radius:8px; font-family:'Reem Kufi'
}
.row{display:flex; gap:8px; align-items:stretch}

/* جداول بسيطة */
.table{ width:100%; border-collapse:collapse; font-size:14px }
.table th,.table td{ border-bottom:1px solid var(--border); padding:6px 4px }
.table th{ background:#f3efe7; color:#2a2a2a; text-align:center }
.table td:first-child{ font-weight:700 }

/* مربعات التأشير (للكتابة اليدوية لاحقًا) */
.checkbox{
  display:inline-block; width:18px; height:18px; border:1.8px solid var(--gold); border-radius:3px; margin-inline-start:6px
}

/* شبكة الورد */
.grid30{ display:grid; grid-template-columns:repeat(10, 1fr); gap:8px; }
.qbox{ border:1.5px dashed var(--gold); border-radius:10px; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-weight:700; color:#8c7a46 }

/* صناديق ملاحظات */
.notes{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.input-line{border:1px solid var(--border); border-radius:10px; padding:6px; color:#555; font-size:14px}
.small{font-size:12px; color:#777}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>دفتر رمضان 1447هـ (2026) – توليد PDF</h1>
    <div class="sub">
      يبدأ من <b>الخميس 19-02-2026</b> (30 يومًا) – تنسيق <b>landscape</b> للآيباد/GoodNotes.  
      اضغط الزر أدناه لتوليد وتحميل PDF.
    </div>
    <div class="tools">
      <button class="btn" id="btnMake">توليد وتحميل PDF</button>
      <button class="btn ghost" id="btnPreview">معاينة (إظهار الصفحات أسفل)</button>
    </div>
    <div class="note">* يشتمل على: الغلاف • معيار النقاط • شبكة الورد (٣٠) • ٣٠ صفحة يومية (الفرائض/الرواتب/الأذكار/الورد/التراويح/الإمساكية) • نقاط اليوم.</div>
  </div>

  <!-- المولد سيبني الصفحات هنا -->
  <div id="planner" aria-hidden="true"></div>
</div>

<script>
/* ============ إعدادات ============ */
const START = new Date('2026-02-19T00:00:00'); // بداية رمضان (يمكن ضبطها)
const DAYS  = 30;                              // عدد أيام البلانر
const A4W = 297, A4H = 210;                    // mm jsPDF (landscape)

/* ============ أدوات بناء الصفحة (HTML) ============ */
function el(tag, attrs={}, ...children){
  const E = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') E.className = v;
    else if(k==='style') E.setAttribute('style', v);
    else E.setAttribute(k, v);
  });
  children.forEach(c=>{
    if(typeof c === 'string') E.appendChild(document.createTextNode(c));
    else if(c) E.appendChild(c);
  });
  return E;
}

function headerBand(title, sub){
  const band = el('div',{class:'header-band'},
    el('h3',{class:'h-title'}, title),
    sub? el('div',{class:'h-sub'}, sub) : null
  );
  return band;
}

function lineCheckbox(){ return el('span',{class:'checkbox'}); }

function section(title, contentEl){
  const box = el('div',{class:'card'},
    el('h3',{class:'section-title'}, title),
    contentEl
  );
  return box;
}

/* ============ صفحات ثابتة: الغلاف، معيار النقاط، شبكة الورد ============ */
function buildCover(){
  const page = el('div',{class:'page'});
  page.appendChild(headerBand('دفتر رمضان 1447هـ (2026) – Landscape', 'متوافق مع GoodNotes • يبدأ 19-02-2026 • 30 يومًا'));
  page.appendChild(
    section('محتويات الدفتر',
      el('div',{},
        '• معيار النقاط',
        el('br'), '• شبكة الورد القرآني (٣٠ يومًا)',
        el('br'), '• الصفحات اليومية (١–٣٠): الفرائض، السنن الرواتب، الأذكار والورد، قيام التراويح، الإمساكية اليومية، نقاط اليوم'
      )
    )
  );
  return page;
}

function buildPointsStandard(){
  const page = el('div',{class:'page'});
  page.appendChild(headerBand('معيار النقاط (للإحتساب اليدوي)'));

  // الفرائض
  const farid = el('table',{class:'table',style:'margin-bottom:8px'});
  farid.innerHTML = `
    <thead><tr><th>الخيار</th><th>النقاط</th></tr></thead>
    <tbody>
      <tr><td>مسجد</td><td><b style="color:var(--accent)">100</b></td></tr>
      <tr><td>جماعة</td><td><b style="color:var(--accent)">30</b></td></tr>
      <tr><td>فرد</td><td><b style="color:var(--accent)">15</b></td></tr>
      <tr><td>قضاء</td><td><b style="color:var(--accent)">5</b></td></tr>
    </tbody>`;
  page.appendChild(section('أولًا: الفرائض', farid));

  // الرواتب
  const raw = el('div',{},
    rowLine('الفجر: قبلية ٢','10/ركعة = 20'),
    rowLine('الظهر: قبلية ٤','5/ركعة = 20'),
    rowLine('الظهر: بعدية ٢','7.5/ركعة ≈ 15'),
    rowLine('المغرب: بعدية ٢','7.5/ركعة ≈ 15'),
    rowLine('العشاء: بعدية ٢','7.5/ركعة ≈ 15'),
    rowLine('(اختياري) قبلية العصر ٤','5/ركعة = 20'),
    rowLine('الجمعة: بعدية ٢ أو ٤','10/ركعة = 20 أو 40'),
  );
  page.appendChild(section('ثانيًا: السنن الرواتب', raw));

  // الأذكار
  const extra = el('div',{},
    rowLine('أذكار الصباح','30'),
    rowLine('أذكار المساء','30'),
    rowLine('أذكار النوم','30'),
    rowLine('سورة الملك (ليلاً)','30'),
    rowLine('خواتيم البقرة (285–286)','20'),
    rowLine('سورة الكهف (الجمعة)','40'),
    rowLine('الورد القرآني (اليوم)','50'),
  );
  page.appendChild(section('ثالثًا: الأذكار والورد', extra));

  // التراويح
  page.appendChild(section('رابعًا: قيام التراويح',
    el('div',{}, 'افتراضي (مقترح): 2 نقطة/ركعة أو 30 نقطة لليلة كاملة',
      el('div',{class:'small',style:'margin-top:4px'}, 'يمكن تعديل المعيار وفق نظام العائلة وكتابة الإجمالي في خانة نقاط اليوم.')
    )
  ));

  function rowLine(lab,val){
    return el('div', {style:'display:flex;justify-content:space-between;border-bottom:1px dashed var(--border);padding:6px 0'},
      el('span',{}, lab),
      el('b',{style:'color:var(--accent)'}, val)
    );
  }

  return page;
}

function buildQuranGrid(){
  const page = el('div',{class:'page'});
  page.appendChild(headerBand('متابعة الورد القرآني – ٣٠ يوم'));
  const grid = el('div',{class:'grid30'});
  for(let i=1;i<=30;i++){
    grid.appendChild(el('div',{class:'qbox'}, String(i).padStart(2,'0')));
  }
  page.appendChild(section('الشهر كاملًا', grid));
  page.appendChild(section('ملاحظات ونقاط الشهر',
    el('div',{},
      el('div',{class:'input-line'}, 'مجموع نقاط الشهر: ______________________________'),
      el('div',{class:'input-line',style:'margin-top:6px'}, 'ملاحظات: ________________________________________________________________')
    )
  ));
  return page;
}

/* ============ صفحة يومية ============ */
function buildDailyPage(dayIndex, dateObj){
  const page = el('div',{class:'page'});
  const weekdayAr = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][dateObj.getDay()];
  const isFriday = weekdayAr === 'الجمعة';
  page.appendChild(headerBand(
    `اليوم ${String(dayIndex).padStart(2,'0')} – ${weekdayAr} – ${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`
  ));

  /* 1) الفرائض */
  const tbl = el('table',{class:'table'});
  tbl.innerHTML = `
    <thead>
      <tr>
        <th>الصلاة</th><th>مسجد</th><th>جماعة</th><th>فرد</th><th>قضاء</th>
      </tr>
    </thead>
    <tbody>
      ${row('الفجر')}
      ${row(isFriday?'الجمعة':'الظهر')}
      ${row('العصر')}
      ${row('المغرب')}
      ${row('العشاء')}
    </tbody>`;
  page.appendChild(section('🕋 الفرائض (مسجد | جماعة | فرد | قضاء)', tbl));
  function row(name){
    return `<tr>
      <td style="text-align:right">${name}</td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
      <td style="text-align:center"><span class="checkbox"></span></td>
    </tr>`;
  }

  /* 2) السنن الرواتب */
  const rawBox = el('div',{},
    rawLine('الفجر: قبلية ٢', 2),
    isFriday ? rawLine('الجمعة: بعدية ٢ أو ٤', 4) : rawLine('الظهر: قبلية ٤', 4),
    isFriday ? null : rawLine('الظهر: بعدية ٢', 2),
    rawLine('المغرب: بعدية ٢', 2),
    rawLine('العشاء: بعدية ٢', 2),
    rawLine('(اختياري) قبلية العصر ٤ – غير مؤكدة', 4)
  );
  page.appendChild(section('🌱 السنن الرواتب', rawBox));
  function rawLine(label, count){
    if(!label) return null;
    const boxes = el('span',{});
    for(let i=0;i<count;i++) boxes.appendChild(lineCheckbox());
    return el('div',{style:'display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)'},
      el('span',{}, label), el('span',{}, boxes)
    );
  }

  /* 3) الأذكار والورد */
  const adh = el('div',{},
    adhLine('☀️ أذكار الصباح'),
    adhLine('🌙 أذكار المساء'),
    adhLine('😴 أذكار النوم'),
    adhLine('📖 سورة الملك (ليلاً)'),
    adhLine('📖 خواتيم سورة البقرة (285–286)'),
    adhLine('📖 الورد القرآني (اليوم)'),
    isFriday ? adhLine('🕌 سورة الكهف (الجمعة)') : null
  );
  page.appendChild(section('📿 الأذكار والورد', adh));
  function adhLine(label){
    return el('div',{style:'display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)'},
      el('span',{}, label), lineCheckbox()
    );
  }

  /* 4) قيام التراويح */
  const tara = el('div',{},
    el('div',{style:'display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)'},
      el('span',{}, 'تم القيام'), lineCheckbox()
    ),
    el('div',{class:'input-line',style:'margin-top:6px'}, 'عدد الركعات: ____________  •  ملاحظات: _________________________________')
  );
  page.appendChild(section('🕯️ قيام التراويح', tara));

  /* 5) الإمساكية اليومية */
  const ims = el('div',{class:'row'},
    // يسار: جدول المواقيت
    section('🕰️ الإمساكية اليومية (مواقيت اليوم)',
      el('table',{class:'table'},
        el('thead',{}, el('tr',{}, el('th',{},'البند'), el('th',{},'الوقت'))),
        el('tbody',{},
          imsRow('الإمساك (آخر وقت للسحور)'),
          imsRow('أذان الفجر'),
          imsRow('الشروق'),
          imsRow('الظهر'),
          imsRow('العصر'),
          imsRow('المغرب (الإفطار)'),
          imsRow('العشاء'),
        )
      )
    ),
    // يمين: نية/سحور/ماء
    section('🌙 نية الصوم والسحور',
      el('div',{},
        lineWithBox('نية الصوم (قلبيًا) تمت ✔'),
        lineWithBox('تمّ السحور'),
        el('div',{style:'margin-top:8px'}, '💧 عدّاد الماء (٨): ',
          el('span',{}, lineCheckbox(), lineCheckbox(), lineCheckbox(), lineCheckbox(),
                         lineCheckbox(), lineCheckbox(), lineCheckbox(), lineCheckbox())
        )
      )
    )
  );
  page.appendChild(ims);
  function imsRow(label){
    const tr = el('tr',{}, el('td',{},label), el('td',{}, '________ : ______'));
    return tr;
  }
  function lineWithBox(label){
    return el('div',{style:'display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)'},
      el('span',{}, label), lineCheckbox()
    );
  }

  /* 6) نقاط اليوم + تعليقات */
  page.appendChild(section('نقاط اليوم والتعليقات',
    el('div',{},
      el('div',{class:'input-line'}, 'نقاط اليوم: ____________________________'),
      el('div',{class:'input-line',style:'margin-top:6px'}, 'تعليقات/تنبيهات: ____________________________________________________')
    )
  ));

  return page;
}

/* ============ توليد كل الصفحات ============ */
async function buildAllPages(previewOnly=false){
  const host = document.getElementById('planner');
  if(host.childElementCount>0) return; // بنيناها سابقًا
  host.style.display = previewOnly ? 'block' : 'none';

  // الغلاف – معيار النقاط – شبكة الورد
  host.appendChild(buildCover());
  host.appendChild(buildPointsStandard());
  host.appendChild(buildQuranGrid());

  // الصفحات اليومية
  for(let i=0;i<DAYS;i++){
    const d = new Date(START); d.setDate(START.getDate()+i);
    host.appendChild(buildDailyPage(i+1, d));
    // معاينة فقط: أظهر أول صفحتين لتخفيف الصفحة
    if(previewOnly && i>1) break;
  }
}

/* ============ تصدير إلى PDF ============ */
async function exportPDF(){
  await buildAllPages(false);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const pages = [...document.querySelectorAll('#planner .page')];

  for(let i=0;i<pages.length;i++){
    const node = pages[i];

    // تأكد من تحميل الخطوط قبل الرسم
    await document.fonts.ready;

    const canvas = await html2canvas(node, {scale:2, useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    if(i>0) pdf.addPage('a4','landscape');
    pdf.addImage(imgData, 'PNG', 0, 0, A4W, A4H);
  }

  pdf.save('Ramadan_1447_2026_Landscape_Planner.pdf');
}

/* ============ أزرار الواجهة ============ */
document.getElementById('btnPreview').onclick = ()=> buildAllPages(true).then(()=> {
  const host = document.getElementById('planner'); host.style.display='block';
  window.scrollTo({top: host.offsetTop, behavior: 'smooth'});
});
document.getElementById('btnMake').onclick = ()=> exportPDF();

</script>
</body>
</html>
