<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Planner Generator - Final</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div style="padding: 50px; text-align: center;">
        <h1>MYH Planner Generator - Final Attempt</h1>
        <button id="btn" style="padding: 20px; font-size: 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 10px;">بدء التوليد (المباشر)</button>
        <p id="status"></p>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            status.textContent = "جاري البناء... انتظر قليلاً";
            
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            const pdfDoc = await PDFDocument.create();
            
            // تحميل خط عربي (ملاحظة: الخطوط العربية معقدة، سنبدأ بالإنجليزية للتجربة ثم نطور)
            // إذا كنت تريد العربية، سنحتاج لملف خط .ttf، سنبدأ هنا بالنصوص للتأكد من عمل الصفحة
            
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            for (let m = 0; m < months.length; m++) {
                let days = new Date(2026, m + 1, 0).getDate();
                for (let d = 1; d <= days; d++) {
                    const page = pdfDoc.addPage([595, 842]); // حجم A4
                    page.drawText(`${months[m]} 2026 - Day ${d}`, {
                        x: 50,
                        y: 800,
                        size: 30,
                        color: rgb(0, 0, 0),
                    });
                    page.drawText("My Custom Planner - MYH", { x: 50, y: 750, size: 15 });
                }
            }

            const pdfBytes = await pdfDoc.save();
            
            // تحميل الملف
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'MYH_Planner_Final.pdf';
            link.click();
            
            status.textContent = "تم التوليد بنجاح! تحقق من التحميل.";
        });
    </script>
</body>
</html>
