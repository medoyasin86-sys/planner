<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تكبير الصور الذكية - My Family's Mihrab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --shadow: 0 4px 6px rgba(0,0,0,0.1); }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin: auto; }
        
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; background: #fdfdfd; padding: 25px; border-radius: 12px; border: 1px solid #eee; }
        .input-group { display: flex; flex-direction: column; text-align: right; gap: 8px; }
        label { font-weight: bold; font-size: 14px; color: var(--primary); }
        input, select { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; transition: 0.3s; }
        input:focus { border-color: var(--accent); outline: none; }

        .button-group { display: flex; gap: 15px; margin-bottom: 30px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-download { background: var(--accent); }
        .btn-print { background: #3498db; }
        .btn:hover { opacity: 0.9; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .preview-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .preview-box { border: 2px solid #eaeeef; border-radius: 12px; padding: 20px; background: #fff; min-height: 400px; }
        .preview-title { font-weight: bold; margin-bottom: 15px; color: var(--primary); text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }

        /* منطقة الصورة الأصلية والشبكة */
        #original-preview-container { position: relative; width: 100%; display: flex; justify-content: center; overflow: hidden; border-radius: 8px; }
        #original-img-view { max-width: 100%; height: auto; display: block; }
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; pointer-events: none; }
        .grid-cell { border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-shadow: 1px 1px 4px #000; font-size: 14px; }

        /* منطقة معاينة الأوراق A4 */
        #pages-preview-container { display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-y: auto; max-height: 600px; padding: 10px; background: #efefef; border-radius: 8px; }
        .page-row { display: flex; gap: 8px; }
        .page-item { border: 1px solid #999; background: white; position: relative; overflow: hidden; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .page-img-crop { position: absolute; width: auto; height: auto; pointer-events: none; opacity: 0.8; }
        .page-label { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; z-index: 10; }
        .overlap-hint { position: absolute; right: 0; top: 0; height: 100%; background: rgba(39, 174, 96, 0.2); border-left: 1px dashed var(--accent); z-index: 5; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; color: var(--primary);">نظام تشريح الصور وتكبيرها للطباعة</h2>
    
    <div class="controls">
        <div class="input-group">
            <label>1. اختر الصورة:</label>
            <input type="file" id="imgInput" accept="image/*" onchange="handleImage(this)">
        </div>
        <div class="input-group">
            <label>2. العرض المطلوب (سم):</label>
            <input type="number" id="wCm" value="60" min="10" oninput="updateAll()">
        </div>
        <div class="input-group">
            <label>3. الارتفاع المطلوب (سم):</label>
            <input type="number" id="hCm" value="80" min="10" oninput="updateAll()">
        </div>
        <div class="input-group">
            <label>4. اتجاه الورقة (A4):</label>
            <select id="orient" onchange="updateAll()">
                <option value="p">عمودي (Portrait)</option>
                <option value="l">أفقي (Landscape)</option>
            </select>
        </div>
    </div>

    <div class="button-group">
        <button class="btn btn-download" onclick="generatePDF(false)">💾 حفظ ملف PDF</button>
        <button class="btn btn-print" onclick="generatePDF(true)">🖨️ طباعة المخطط</button>
    </div>

    <div class="preview-section">
        <div class="preview-box">
            <div class="preview-title">أولاً: خريطة تقسيم الصورة</div>
            <div id="original-preview-container">
                <img id="original-img-view" src="">
                <div id="grid-overlay" class="grid-overlay"></div>
            </div>
        </div>

        <div class="preview-box">
            <div class="preview-title">ثانياً: شكل الأوراق بعد التشريح (A4)</div>
            <div id="pages-preview-container">
                <p style="color: #999; margin-top: 50px;">ارفع صورة لرؤية المعاينة...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const overlapMm = 15; // تداخل 1.5 سم لللصق
    let currentImgData = null;

    function handleImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImgData = e.target.result;
                const img = document.getElementById('original-img-view');
                img.src = currentImgData;
                img.onload = updateAll;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function updateAll() {
        const img = document.getElementById('original-img-view');
        if (!img.src || img.naturalWidth === 0) return;

        const orient = document.getElementById('orient').value;
        const targetW_mm = parseFloat(document.getElementById('wCm').value) * 10;
        const targetH_mm = parseFloat(document.getElementById('hCm').value) * 10;
        
        const pW = orient === 'p' ? 210 : 297;
        const pH = orient === 'p' ? 297 : 210;
        
        // المساحة الفعلية للصورة في كل ورقة بعد خصم منطقة التداخل
        const effW = pW - overlapMm;
        const effH = pH - overlapMm;
        
        const cols = Math.ceil(targetW_mm / effW);
        const rows = Math.ceil(targetH_mm / effH);

        // --- 1. تحديث الشبكة فوق الصورة ---
        const overlay = document.getElementById('grid-overlay');
        overlay.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        overlay.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        overlay.innerHTML = '';
        
        for (let i = 1; i <= (rows * cols); i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.innerText = i;
            overlay.appendChild(cell);
        }

        // --- 2. تحديث معاينة الأوراق المنفصلة ---
        const pagesContainer = document.getElementById('pages-preview-container');
        pagesContainer.innerHTML = '';
        const scale = 0.4; // تصغير المعاينة لتناسب الشاشة

        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'page-row';
            
            for (let c = 0; c < cols; c++) {
                const pageItem = document.createElement('div');
                pageItem.className = 'page-item';
                pageItem.style.width = pW * scale + 'px';
                pageItem.style.height = pH * scale + 'px';

                // إضافة قطعة من الصورة داخل الورقة للمعاينة
                const crop = document.createElement('img');
                crop.src = currentImgData;
                crop.className = 'page-img-crop';
                
                // حسابات التموضع داخل الورقة (بالمقاييس النسبية)
                const zoomW = (targetW_mm / effW) * 100;
                const zoomH = (targetH_mm / effH) * 100;
                
                crop.style.width = zoomW + '%';
                crop.style.left = -(c * 100) + '%';
                crop.style.top = -(r * 100) + '%';

                const label = document.createElement('div');
                label.className = 'page-label';
                label.innerText = `ورقة ${r * cols + c + 1}`;

                // منطقة التداخل (Paste area)
                if (c < cols - 1 || r < rows - 1) {
                    const hint = document.createElement('div');
                    hint.className = 'overlap-hint';
                    if (c < cols - 1) hint.style.width = (overlapMm * scale) + 'px';
                    pageItem.appendChild(hint);
                }

                pageItem.appendChild(label);
                pageItem.appendChild(crop);
                rowDiv.appendChild(pageItem);
            }
            pagesContainer.appendChild(rowDiv);
        }
    }

    async function generatePDF(isPrint) {
        const { jsPDF } = window.jspdf;
        const img = document.getElementById('original-img-view');
        if (!img.src) { alert("يرجى اختيار صورة أولاً"); return; }

        const targetW = parseFloat(document.getElementById('wCm').value) * 10;
        const targetH = parseFloat(document.getElementById('hCm').value) * 10;
        const orient = document.getElementById('orient').value;

        const pdf = new jsPDF({ orientation: orient, unit: 'mm', format: 'a4' });
        const pW = pdf.internal.pageSize.getWidth();
        const pH = pdf.internal.pageSize.getHeight();
        const effW = pW - overlapMm;
        const effH = pH - overlapMm;
        const cols = Math.ceil(targetW / effW);
        const rows = Math.ceil(targetH / effH);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (r > 0 || c > 0) pdf.addPage();
                
                // رسم الجزء المخصص من الصورة
                pdf.addImage(img, 'JPEG', -c * effW, -r * effH, targetW, targetH, undefined, 'FAST');
                
                // رسم تظليل منطقة التداخل (رمادي خفيف)
                pdf.setFillColor(240, 240, 240);
                pdf.setDrawColor(200, 200, 200);
                
                if (c < cols - 1) { // تداخل جانبي
                    pdf.rect(pW - overlapMm, 0, overlapMm, pH, 'F');
                    pdf.line(pW - overlapMm, 0, pW - overlapMm, pH);
                    pdf.setFontSize(8);
                    pdf.setTextColor(150);
                    pdf.text("مكان اللصق", pW - (overlapMm/2), pH/2, { angle: 90, align: 'center' });
                }
                
                if (r < rows - 1) { // تداخل سفلي
                    pdf.rect(0, pH - overlapMm, pW, overlapMm, 'F');
                    pdf.line(0, pH - overlapMm, pW, pH - overlapMm);
                    pdf.setTextColor(150);
                    pdf.text("مكان اللصق", pW/2, pH - (overlapMm/4), { align: 'center' });
                }

                // إضافة رقم الورقة في الزاوية
                pdf.setFontSize(12);
                pdf.setTextColor(0, 0, 0);
                pdf.text(`${r * cols + c + 1}`, 10, 15);
            }
        }
        
        if (isPrint) {
            window.open(pdf.output('bloburl'), '_blank');
        } else {
            pdf.save("My_Poster_Plan.pdf");
        }
    }
</script>

</body>
</html>
