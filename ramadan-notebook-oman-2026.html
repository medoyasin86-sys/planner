<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>دفتر رمضان 1447 هـ (عُمان) — يبدأ 19 فبراير 2026</title>

<!-- خط عربي (اختياري عبر الإنترنت)، مع بدائل محلية -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    /* لوحة ألوان باستيل */
    --bg:#fbfaf7;
    --paper:#ffffff;
    --ink:#2e3134;
    --muted:#6f757a;
    --grid:#d7d3cc;
    --accent:#caa56a;       /* ذهبي مطفأ */
    --accent-2:#a9c1b6;     /* أخضر ساج باهت */
    --accent-soft:#efe6d5;  /* خلفية خفيفة */
    --warn:#b23b3b;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Cairo","Tajawal","Noto Naskh Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
    line-height:1.55;
  }

  /* تخطيط صفحات للطباعة A4 عمودي */
  .book{
    width: 210mm;
    margin: 0 auto;
    padding: 10mm 0 20mm;
  }
  .page{
    width: 210mm; min-height: 297mm;
    background:var(--paper);
    border:1.5px solid var(--grid);
    border-radius:12px;
    margin: 0 0 10mm 0;
    padding: 14mm 14mm 16mm;
    position: relative;
    box-shadow: 0 6px 24px rgba(0,0,0,.06);
  }
  .page h1,.page h2,.page h3,.page h4{margin:0 0 8px}
  .page h1{font-size: 26px; font-weight:800}
  .page h2{font-size: 20px; font-weight:800}
  .page h3{font-size: 16px; font-weight:700}
  .sub{color:var(--muted); font-weight:600}
  .ribbon{
    display:inline-block; background:var(--accent); color:#fff;
    padding:6px 12px; border-radius:12px; font-weight:800;
  }
  .badge{
    display:inline-block; background:var(--accent-soft); border:1px solid var(--accent);
    color:var(--ink); padding:4px 10px; border-radius:10px; font-weight:700;
  }

  .grid{
    display:grid; gap:10px;
  }

  /* غلاف */
  .cover{
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; height:100%;
    background:linear-gradient(180deg, #fff, var(--accent-soft));
    border:2px solid var(--accent);
  }
  .cover h1{font-size:36px}
  .cover .year{color:var(--muted); font-weight:700}
  .name-line{
    margin-top:16px; font-weight:700;
  }
  .line{
    display:inline-block; min-width:180px; border-bottom:2px dotted var(--grid);
    height:1.2em; vertical-align:baseline;
  }

  /* نظرة شهرية */
  .month-grid{
    margin-top:10px;
    display:grid; grid-template-columns: repeat(6, 1fr); gap:8px;
  }
  .day-card{
    border:1.5px solid var(--grid); border-radius:10px; padding:8px; background:#fff;
  }
  .day-card .head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
    font-weight:700;
  }
  .friday{ color:#0a6640; }
  .tiny{font-size:.9rem; color:var(--muted);}

  /* متابعة الختمة */
  .quran-30{
    display:grid; grid-template-columns: repeat(10, minmax(18px,1fr)); gap:8px; margin-top:10px;
  }
  .qbox{
    border:1.5px solid var(--grid); border-radius:6px; text-align:center; padding:6px 0; background:#fff;
    font-weight:700;
  }

  /* الصفحة اليومية */
  .header-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px; border:2px solid var(--accent); border-radius:12px; background:var(--accent-soft);
    margin-bottom:10px;
  }
  .date-wrap{display:flex; gap:10px; align-items:center}
  .goals{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .goals .line{min-width:120px}

  .section{
    border:1.5px solid var(--grid); border-radius:12px; padding:10px; background:#fff;
  }
  .section + .section{margin-top:10px}

  /* الصلوات */
  .prayers{
    display:grid; grid-template-columns: 92px 1fr; gap:8px 10px; align-items:center;
  }
  .p-name{font-weight:700}
  .opts{ display:flex; flex-wrap:wrap; gap:8px 12px }
  label.chk{ display:inline-flex; align-items:center; gap:6px; font-weight:600 }
  input[type="checkbox"]{ width:16px; height:16px }

  /* السنن الرواتب */
  table.sunan{ width:100%; border-collapse:collapse; }
  table.sunan th, table.sunan td{
    border-bottom:1px dashed var(--grid); padding:6px 4px; text-align:right;
  }
  table.sunan th{ color:var(--muted); font-weight:700 }
  .dots{ display:inline-grid; grid-auto-flow:column; gap:6px; vertical-align:middle }
  .dot{ width:16px; height:16px; border:1.5px solid var(--ink); border-radius:4px; display:inline-block }

  /* الورد القرآني + الأذكار */
  .row{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px }
  .row .line{min-width:140px}
  .adhkar{ display:flex; flex-wrap:wrap; gap:8px 12px; margin-top:6px }

  /* الملاحظات */
  .notes{
    min-height: 65mm;
    border:1.5px solid var(--grid); border-radius:12px; padding:10px; background: #fff url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"8\" height=\"8\"><circle cx=\"1\" cy=\"1\" r=\"1\" fill=\"%23e8e5de\"/></svg>') repeat;
    background-size: 12px 12px;
  }

  /* تذييل الصفحة */
  .footer{
    position:absolute; inset-inline:14mm; bottom:10mm; color:var(--muted);
    display:flex; justify-content:space-between; font-size:.9rem;
  }

  /* الطباعة */
  @media print {
    body{ background:#fff }
    .book{ width:auto; padding:0 }
    .page{ border:0; border-radius:0; box-shadow:none; page-break-after:always; margin:0; }
    .notes{ background-image:none; }
    a.print-hint{ display:none !important; }
  }
</style>
</head>
<body>

<div class="book" id="book">
  <!-- الصفحات تُنشأ بالـ JS -->
</div>

<script>
/* ======================= مُعطيات أساسية ======================= */
const startDateISO = '2026-02-19';       // بداية رمضان في عُمان (مُعلَن رسميًا)
const daysCount = 30;                    // عدد أيام الدفتر
const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const weekdayAr = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

/* تحويل الأرقام إلى عربية */
const toArabicDigits = s => (s+'').replace(/\d/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* توليد تواريخ رمضان (30 يومًا) */
function generateRamadanDays(startISO, count){
  const arr = [];
  const start = new Date(startISO+'T00:00:00');
  for(let i=0;i<count;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const dd = d.getDate(), mm = d.getMonth(), yyyy = d.getFullYear();
    const weekday = weekdayAr[d.getDay()];
    const iso = d.toISOString().slice(0,10);
    arr.push({
      ramadanDay: i+1,
      iso,
      weekday,
      greg: `${toArabicDigits(dd)} ${monthNames[mm]} ${toArabicDigits(yyyy)}`,
      isFriday: (weekday==='الجمعة')
    });
  }
  return arr;
}
const ramadan = generateRamadanDays(startDateISO, daysCount);

/* ======================= أدوات بناء العناصر ======================= */
const el = (tag, props={}, children=[])=>{
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==='class') e.className = v;
    else if(k==='html') e.innerHTML = v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).filter(Boolean).forEach(ch=>{
    if(typeof ch==='string'){ e.appendChild(document.createTextNode(ch)); }
    else e.appendChild(ch);
  });
  return e;
};

/* قطعة السنن الرواتب */
function sunanTable(){
  const tbl = el('table',{class:'sunan', role:'table', 'aria-label':'السنن الرواتب'});
  tbl.innerHTML = `
    <thead><tr>
      <th>الصلاة</th><th>قبلية</th><th>بعدية</th>
    </tr></thead>
    <tbody>
      <tr><td><strong>الفجر</strong></td>
          <td><span class="dots"><span class="dot"></span><span class="dot"></span></span> <span class="sub">٢</span></td>
          <td class="sub">—</td></tr>
      <tr><td><strong>الظهر</strong></td>
          <td><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></span> <span class="sub">٤</span></td>
          <td><span class="dots"><span class="dot"></span><span class="dot"></span></span> <span class="sub">٢</span></td></tr>
      <tr><td><strong>العصر</strong></td><td class="sub">—</td><td class="sub">—</td></tr>
      <tr><td><strong>المغرب</strong></td><td class="sub">—</td>
          <td><span class="dots"><span class="dot"></span><span class="dot"></span></span> <span class="sub">٢</span></td></tr>
      <tr><td><strong>العشاء</strong></td><td class="sub">—</td>
          <td><span class="dots"><span class="dot"></span><span class="dot"></span></span> <span class="sub">٢</span></td></tr>
    </tbody>`;
  return tbl;
}

/* سطر الصلاة بخياراتها */
function prayerRow(name){
  const wrapName = el('div',{class:'p-name'}, name);
  const opts = el('div',{class:'opts'},[
    el('label',{class:'chk'},[el('input',{type:'checkbox'}),'مسجد']),
    el('label',{class:'chk'},[el('input',{type:'checkbox'}),'جماعة']),
    el('label',{class:'chk'},[el('input',{type:'checkbox'}),'فرد']),
    el('label',{class:'chk'},[el('input',{type:'checkbox'}),'قضاء'])
  ]);
  return [wrapName, opts];
}

/* الأذكار */
function adhkarRow(isFriday){
  const list = [
    'أذكار الصباح','أذكار المساء','أذكار النوم','سورة الملك (ليلاً)','خواتيم سورة البقرة'
  ];
  if(isFriday) list.push('سورة الكهف (الجمعة)');
  return el('div',{class:'adhkar'},
    list.map(txt=>el('label',{class:'chk'},[el('input',{type:'checkbox'}),txt]))
  );
}

/* صفحة غلاف */
function coverPage(){
  const p = el('section',{class:'page cover', role:'article','aria-label':'غلاف الدفتر'});
  const year = '١٤٤٧ هـ — ٢٠٢٦';
  p.append(
    el('div',{},[
      el('div',{class:'ribbon'},'دفتر رمضان'),
      el('h1',{},'عباداتي في رمضان'),
      el('div',{class:'year'},year),
      el('div',{class:'name-line'},['الاسم: ', el('span',{class:'line',title:'اكتب اسمك هنا'})]),
      el('div',{style:'margin-top:10px; color:#6f757a; font-weight:600'},
        'في سلطنة عُمان يبدأ رمضان يوم الخميس 19 فبراير 2026')
    ])
  );
  return p;
}

/* صفحة نظرة شهرية + الختمة */
function monthOverview(){
  const p = el('section',{class:'page grid', role:'article','aria-label':'النظرة الشهرية'});
  p.append(el('div',{},[
    el('div',{class:'ribbon'},'نظرة شهرية'),
    el('div',{class:'sub', style:'margin-top:6px'},'من 19 فبراير إلى 20 مارس 2026 (30 يومًا)')
  ]));

  const mg = el('div',{class:'month-grid'});
  ramadan.forEach(d=>{
    const card = el('div',{class:'day-card'},[
      el('div',{class:'head'},[
        el('span',{},['اليوم ', toArabicDigits(d.ramadanDay)]),
        el('span',{class:d.isFriday?'friday tiny':'tiny'}, d.weekday)
      ]),
      el('div',{class:'tiny'}, d.greg)
    ]);
    mg.append(card);
  });
  p.append(mg);

  p.append(el('div',{style:'margin-top:14px'},[
    el('h2',{},'متابعة الختمة'),
    el('div',{class:'quran-30'},
      Array.from({length:30},(_,i)=>el('div',{class:'qbox'}, toArabicDigits(i+1)))
    )
  ]));
  return p;
}

/* صفحة يومية */
function dayPage(d){
  const p = el('section',{class:'page', role:'article','aria-label':`اليوم ${d.ramadanDay}`});

  // رأس الصفحة
  const head = el('div',{class:'header-row'},[
    el('div',{class:'date-wrap'},[
      el('span',{class:'badge'}, `اليوم ${toArabicDigits(d.ramadanDay)}`),
      el('strong',{}, d.weekday),
      el('span',{class:'sub'}, d.greg)
    ]),
    el('div',{class:'goals'},[
      el('span',{},'هدف اليوم:'), el('span',{class:'line',title:'اكتب هدفك'}) ,
      el('span',{},'التقييم:'), el('span',{class:'line',style:'min-width:60px'})
    ])
  ]);
  p.append(head);

  /* الصلوات */
  const prayersSec = el('div',{class:'section'});
  prayersSec.append(el('h3',{},'الصلوات'));
  const grid = el('div',{class:'prayers'});
  // الفجر
  grid.append(...prayerRow('الفجر'));
  // الظهر / الجمعة
  grid.append(...prayerRow(d.isFriday ? 'الجمعة' : 'الظهر'));
  // العصر
  grid.append(...prayerRow('العصر'));
  // المغرب
  grid.append(...prayerRow('المغرب'));
  // العشاء
  grid.append(...prayerRow('العشاء'));
  prayersSec.append(grid);
  p.append(prayersSec);

  /* السنن الرواتب */
  const sunanSec = el('div',{class:'section'});
  sunanSec.append(el('h3',{},['السنن الرواتب ', el('span',{class:'sub'},'(قبلية / بعدية)')]));
  sunanSec.append(sunanTable());
  p.append(sunanSec);

  /* الورد القرآني + الأذكار */
  const qSec = el('div',{class:'section'});
  qSec.append(el('h3',{},'الورد القرآني'));
  qSec.append(el('div',{class:'row'},[
    el('span',{},'ورد اليوم:'), el('span',{class:'line', title:'اكتب مقدار الورد'}), el('span',{},'صفحة / جزء'),
    el('label',{class:'chk'},[el('input',{type:'checkbox'}),'تمَّ'])
  ]));
  qSec.append(el('h3',{style:'margin-top:8px'},'الأذكار'));
  qSec.append(adhkarRow(d.isFriday));
  p.append(qSec);

  /* الملاحظات */
  const notes = el('div',{class:'section'});
  notes.append(el('h3',{},'ملاحظات'));
  notes.append(el('div',{class:'notes', title:'مساحة مفتوحة للكتابة اليدوية'}));
  p.append(notes);

  /* تذييل */
  const foot = el('div',{class:'footer'},[
    el('span',{}, 'دفتر رمضان — سلطنة عُمان'),
    el('span',{}, `من ${toArabicDigits(1)} إلى ${toArabicDigits(30)} رمضان ١٤٤٧ هـ`)
  ]);
  p.append(foot);

  return p;
}

/* بناء الكتاب */
const book = document.getElementById('book');
book.append( coverPage() );
book.append( monthOverview() );
ramadan.forEach(d => book.append( dayPage(d) ));

/* تلميح الطباعة */
const hint = document.createElement('a');
hint.href="#";
hint.className = 'print-hint';
hint.style.cssText = "position:fixed;left:12px;bottom:12px;background:#111;color:#fff;padding:10px 12px;border-radius:10px;text-decoration:none;opacity:.9";
hint.textContent = '🖨️ طباعة إلى PDF';
hint.onclick = (e)=>{ e.preventDefault(); window.print(); };
document.body.append(hint);
</script>
</body>
</html>
